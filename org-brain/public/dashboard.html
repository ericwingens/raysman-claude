<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Org Brain — Dashboard</title>
<style>

  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:1rem;padding:.75rem 1rem;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:1rem;margin:0;display:flex;align-items:center;gap:.5rem}
  .dot{width:.6rem;height:.6rem;border-radius:50%;display:inline-block}
  .mode{font-size:.72rem;color:var(--muted);border:1px solid var(--border);border-radius:1rem;padding:.15rem .6rem}
  .grow{flex:1}
  button{font:inherit;cursor:pointer;border-radius:.4rem;border:1px solid var(--border);background:transparent;color:var(--fg);padding:.4rem .7rem;font-size:.82rem}
  button:hover{background:rgba(255,255,255,.05)}
  button.primary{background:var(--accent);color:#000;border-color:transparent;font-weight:600}
  button.danger{border-color:rgba(248,113,113,.35);color:#fca5a5}
  button.danger:hover{background:rgba(248,113,113,.12)}
  button.sm{padding:.25rem .5rem;font-size:.74rem}
  input,select,textarea{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:.4rem;padding:.4rem .55rem;font-size:.82rem;width:100%}
  textarea{resize:vertical;min-height:5rem}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:.74rem}
  .layout{display:flex;height:calc(100vh - 53px)}
  aside{width:230px;flex:0 0 230px;border-right:1px solid var(--border);background:var(--panel);padding:1rem;overflow:auto}
  main{flex:1;min-width:0;overflow:auto;padding:1rem}
  .label{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 .35rem}
  .typebtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:.35rem .5rem;border:none;border-radius:.4rem;color:var(--fg);font-size:.8rem}
  .typebtn .left{display:flex;align-items:center;gap:.5rem}
  .typebtn[data-on="false"]{opacity:.4}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--bg)}
  tr:hover td{background:rgba(255,255,255,.02)}
  .chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:1rem;padding:.1rem .5rem;font-size:.72rem}
  .row-actions{display:flex;gap:.35rem;justify-content:flex-end}
  .toolbar{display:flex;gap:.5rem;align-items:center;margin-bottom:.85rem;flex-wrap:wrap}
  .stats{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.85rem}
  .stat{font-size:.72rem;color:var(--muted);border:1px solid var(--border);border-radius:.4rem;padding:.2rem .5rem}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:2.5rem 1rem;overflow:auto;z-index:50}
  .modal{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--border);border-radius:.7rem;padding:1.25rem;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal h2{margin:0 0 1rem;font-size:1.05rem}
  .field{margin-bottom:.85rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .conn{display:flex;align-items:center;gap:.5rem;padding:.3rem .4rem;border-radius:.4rem}
  .conn:hover{background:rgba(255,255,255,.04)}
  .conn .rel{color:var(--accent);font-size:.72rem}
  .err{color:#fca5a5;font-size:.8rem;margin:.5rem 0}
  .hint{color:var(--muted);font-size:.78rem}
  a{color:var(--accent)}
  dialog{color:var(--fg)}
  .right{display:flex;gap:.5rem;align-items:center}
</style>
</head>
<body>
<header>
  <h1><span class="dot" style="background:var(--accent)"></span> Org Brain · Dashboard</h1>

  <span class="grow"></span>
  <div class="right">

    <button class="primary" id="btnAdd">+ Add item</button>
  </div>
</header>

<div class="layout">

    </div>
    <div style="margin-top:1.25rem">

  </main>
</div>

const TYPES=['person','subagent','tool','workflow','sop','project','team','department'];
const TYPE_LABEL={person:'Person',subagent:'Sub-agent',tool:'Tool',workflow:'Workflow',sop:'SOP',project:'Project',team:'Team',department:'Department'};
const TYPE_COLOR={person:'#60a5fa',subagent:'#a78bfa',tool:'#34d399',workflow:'#f59e0b',sop:'#f472b6',project:'#22d3ee',team:'#94a3b8',department:'#e2e8f0'};
const REL_TYPES=['reports_to','member_of','belongs_to','uses','follows','owns','triggers','part_of'];
const PREFIX={person:'p',subagent:'a',tool:'t',workflow:'wf',sop:'sop',project:'prj',team:'team',department:'dept'};

const state={
  mode:'local',
  apiBase:(localStorage.getItem('ob_api_base')||'').replace(/\/$/,''),
  token:localStorage.getItem('ob_edit_token')||'',
  nodes:[], edges:[],
  filter:new Set(TYPES),
  search:''
};

const $=s=>document.querySelector(s);
const overlay=$('#overlay');
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40);}
function byId(id){return state.nodes.find(n=>n.id===id);}

// ---------- data loading ----------
async function load(){
  if(state.apiBase){
    try{
      const r=await fetch(state.apiBase+'/api/nodes');
      const d=await r.json();
      state.nodes=d.nodes||[]; state.edges=d.edges||[];
      state.mode='live';
    }catch(e){ alert('Could not reach API at '+state.apiBase+'. Falling back to local data.\n'+e); useLocal(); }
  } else { useLocal(); }
  render();
}
function useLocal(){
  state.mode='local';
  state.nodes=JSON.parse(JSON.stringify(EMBEDDED_SEED.nodes||[]));
  state.edges=JSON.parse(JSON.stringify(EMBEDDED_SEED.edges||[]));
}
async function reloadLive(){
  const r=await fetch(state.apiBase+'/api/nodes'); const d=await r.json();
  state.nodes=d.nodes||[]; state.edges=d.edges||[];
}

// ---------- live API ----------
function headers(){return{'Content-Type':'application/json','x-edit-token':state.token};}
async function apiErr(r){let m='';try{m=(await r.json()).error||''}catch(e){} return new Error(m||('HTTP '+r.status));}
async function liveCreateNode(input){const r=await fetch(state.apiBase+'/api/nodes',{method:'POST',headers:headers(),body:JSON.stringify(input)});if(!r.ok)throw await apiErr(r);return (await r.json()).node;}
async function liveUpdateNode(id,patch){const r=await fetch(state.apiBase+'/api/nodes/'+encodeURIComponent(id),{method:'PATCH',headers:headers(),body:JSON.stringify(patch)});if(!r.ok)throw await apiErr(r);}
async function liveDeleteNode(id){const r=await fetch(state.apiBase+'/api/nodes/'+encodeURIComponent(id),{method:'DELETE',headers:headers()});if(!r.ok)throw await apiErr(r);}
async function liveCreateEdge(s,t,rel){const r=await fetch(state.apiBase+'/api/edges',{method:'POST',headers:headers(),body:JSON.stringify({source:s,target:t,rel_type:rel})});if(!r.ok)throw await apiErr(r);}
async function liveDeleteEdge(id){const r=await fetch(state.apiBase+'/api/edges/'+encodeURIComponent(id),{method:'DELETE',headers:headers()});if(!r.ok)throw await apiErr(r);}

// ---------- mutations (branch on mode) ----------
function genId(type,name){let base=PREFIX[type]+'_'+(slug(name)||'node');let id=base,i=2;while(byId(id)){id=base+'_'+i;i++;}return id;}

async function saveNode(id,input){
  if(state.mode==='live'){
    if(id) await liveUpdateNode(id,input); else await liveCreateNode(input);
    await reloadLive();
  }else{
    if(id){const n=byId(id);Object.assign(n,input);}
    else{state.nodes.push({id:genId(input.type,input.name),...input});}
  }
  render();
}
async function removeNode(id){
  if(state.mode==='live'){await liveDeleteNode(id);await reloadLive();}
  else{state.nodes=state.nodes.filter(n=>n.id!==id);state.edges=state.edges.filter(e=>e.source!==id&&e.target!==id);}
  render();
}
async function addEdge(s,t,rel){
  if(state.mode==='live'){await liveCreateEdge(s,t,rel);await reloadLive();}
  else{state.edges.push({id:'e_'+Math.random().toString(36).slice(2,8),source:s,target:t,rel_type:rel});}
}
async function removeEdge(id){
  if(state.mode==='live'){await liveDeleteEdge(id);await reloadLive();}
  else{state.edges=state.edges.filter(e=>e.id!==id);}
}

// ---------- rendering ----------
function render(){
  $('#modeBadge').textContent=state.mode+(state.mode==='live'?' · '+state.apiBase.replace(/^https?:\/\//,''):'');
  $('#modeBadge').style.color=state.mode==='live'?'#34d399':'var(--muted)';

  // type filters
  const tf=$('#typeFilters'); tf.innerHTML='';
  TYPES.forEach(t=>{
    const count=state.nodes.filter(n=>n.type===t).length;
    const b=document.createElement('button');
    b.className='typebtn'; b.dataset.on=state.filter.has(t);
    b.innerHTML='<span class="left"><span class="dot" style="background:'+TYPE_COLOR[t]+'"></span>'+TYPE_LABEL[t]+'</span><span class="hint">'+count+'</span>';
    b.onclick=()=>{state.filter.has(t)?state.filter.delete(t):state.filter.add(t);render();};
    tf.appendChild(b);
  });

  // stats
  $('#stats').innerHTML='<span class="stat">'+state.nodes.length+' items</span><span class="stat">'+state.edges.length+' links</span>'+
    (state.mode==='local'?'<span class="stat" style="color:#f59e0b">unsaved · export to keep</span>':'');

  // rows
  const q=state.search.toLowerCase();
  const rows=state.nodes
    .filter(n=>state.filter.has(n.type))
    .filter(n=>!q || (n.name+' '+(n.content||'')+' '+n.id).toLowerCase().includes(q))
    .sort((a,b)=>a.type.localeCompare(b.type)||a.name.localeCompare(b.name));
  const tb=$('#rows'); tb.innerHTML='';
  rows.forEach(n=>{
    const links=state.edges.filter(e=>e.source===n.id||e.target===n.id).length;
    const tr=document.createElement('tr');
    tr.innerHTML=
      '<td><div>'+esc(n.name)+'</div><div class="mono hint">'+esc(n.id)+'</div></td>'+
      '<td><span class="chip" style="background:'+TYPE_COLOR[n.type]+'22;color:'+TYPE_COLOR[n.type]+'">'+TYPE_LABEL[n.type]+'</span></td>'+
      '<td class="hint">'+esc(n.department||'—')+'</td>'+
      '<td class="hint">'+esc(n.business_function||'—')+'</td>'+
      '<td class="hint">'+links+'</td>'+
      '<td><div class="row-actions"><button class="sm">Edit</button><button class="sm danger">Del</button></div></td>';
    tr.querySelector('button.sm:not(.danger)').onclick=()=>openEditor(n);
    tr.querySelector('button.danger').onclick=async()=>{ if(confirm('Delete "'+n.name+'" and its links?')){ try{await removeNode(n.id);}catch(e){alert('Failed: '+e.message);} } };
    tb.appendChild(tr);
  });
  if(!rows.length){tb.innerHTML='<tr><td colspan="6" class="hint" style="padding:2rem;text-align:center">No items match.</td></tr>';}
}

    row.innerHTML='<span class="rel">'+e.rel_type+'</span><span class="hint">'+dir+'</span><span style="flex:1">'+esc(other?other.name:otherId)+'</span><button class="sm danger">✕</button>';
    row.querySelector('button').onclick=async()=>{try{await removeEdge(e.id);const fresh=state.edges.filter(x=>x.source===node.id||x.target===node.id);renderConns(node,fresh);}catch(err){alert('Failed: '+err.message);}};

// ---------- bulk import ----------
function parseCSV(text){
  const rows=[];let i=0,field='',row=[],inq=false;
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  while(i<text.length){
    const c=text[i];
    if(inq){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inq=false;i++;continue; }
      field+=c;i++;continue;
    }
    if(c==='"'){inq=true;i++;continue;}
    if(c===','){row.push(field);field='';i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}
    field+=c;i++;
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>!(r.length===1&&r[0].trim()===''));
}
const CSV_KNOWN={id:'id',type:'type',name:'name',department:'department',dept:'department',business_function:'business_function',function:'business_function',content:'content',description:'content'};
function rowsToNodes(headers,dataRows,defType){
  const hs=headers.map(h=>h.trim());
  return dataRows.map(cells=>{
    const node={type:defType,name:'',department:null,business_function:null,content:'',props:{}};
    const issues=[];
    hs.forEach((h,idx)=>{
      const raw=(cells[idx]==null?'':cells[idx]).trim();
      if(raw==='')return;
      const lc=h.toLowerCase(), key=CSV_KNOWN[lc];
      if(key==='type'){ if(TYPES.includes(raw))node.type=raw; else issues.push('type→'+defType); }
      else if(key==='name')node.name=raw;
      else if(key==='department')node.department=raw;
      else if(key==='business_function')node.business_function=(raw==='core'||raw==='enabling')?raw:null;
      else if(key==='content')node.content=raw;
      else if(key==='id')node.id=raw;
      else if(lc==='props'){ try{Object.assign(node.props,JSON.parse(raw));}catch(e){issues.push('bad props json');} }
      else if(lc==='tools'){ node.props.tools=raw.split(/[;,]/).map(s=>s.trim()).filter(Boolean); }
      else { node.props[h]=raw; }
    });
    if(!node.name)issues.push('missing name');
    return {node,issues};
  });
}
async function runImport(items,edges){
  let ok=0,fail=0;
  if(state.mode==='live'){
    for(const it of items){ try{ await liveCreateNode(it.node); ok++; }catch(e){ fail++; } }
    for(const e of (edges||[])){ try{ await liveCreateEdge(e.source,e.target,e.rel_type); ok++; }catch(_){ fail++; } }
    await reloadLive();
  }else{
    for(const it of items){ const id=(it.node.id&&!byId(it.node.id))?it.node.id:genId(it.node.type,it.node.name); state.nodes.push(Object.assign({},it.node,{id})); ok++; }
    for(const e of (edges||[])){ if(byId(e.source)&&byId(e.target)){ state.edges.push({id:'e_'+Math.random().toString(36).slice(2,8),source:e.source,target:e.target,rel_type:e.rel_type}); ok++; } else { fail++; } }
  }
  render();
  return {ok,fail};
}
function renderBulkPreview(box,items,edges){
  const valid=items.filter(x=>!x.issues.includes('missing name')).length;
  const skipped=items.length-valid;
  const head='<div class="hint" style="margin-bottom:.4rem">'+valid+' of '+items.length+' importable'+(edges?(' · '+edges.length+' links'):'')+(skipped?(' · '+skipped+' skipped (no name)'):'')+'</div>';
  const rowsHtml=items.slice(0,300).map(x=>'<tr><td>'+esc(x.node.name||'—')+'</td><td><span class="chip" style="background:'+TYPE_COLOR[x.node.type]+'22;color:'+TYPE_COLOR[x.node.type]+'">'+TYPE_LABEL[x.node.type]+'</span></td><td class="hint">'+esc(x.node.department||'—')+'</td><td class="hint">'+(x.issues.length?('<span style="color:#f59e0b">'+esc(x.issues.join(', '))+'</span>'):'ok')+'</td></tr>').join('');
  box.querySelector('#b_preview').innerHTML=head+'<div style="max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:.4rem"><table><thead><tr><th>Name</th><th>Type</th><th>Dept</th><th>Status</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>';
  const links=edges?edges.length:0;
  const imp=box.querySelector('#b_import'); imp.disabled=(valid===0&&links===0);
  imp.textContent=(links&&!valid)?('Import '+links+' link'+(links===1?'':'s')):('Import '+valid+' item'+(valid===1?'':'s')+(links?(' + '+links+' links'):''));
}
function rowsToEdges(headers,dataRows){
  const hs=headers.map(h=>h.trim().toLowerCase());
  const si=hs.indexOf('source'), ti=hs.indexOf('target');
  let ri=hs.indexOf('rel_type'); if(ri<0)ri=hs.indexOf('rel'); if(ri<0)ri=hs.indexOf('relationship');
  return dataRows.map(cells=>{
    const source=((cells[si]==null?'':cells[si])+'').trim();
    const target=((cells[ti]==null?'':cells[ti])+'').trim();
    const rel=ri>=0?((cells[ri]==null?'':cells[ri])+'').trim():'';
    const issues=[];
    if(!source||!target)issues.push('missing source/target');
    else{ if(!byId(source))issues.push('unknown source'); if(!byId(target))issues.push('unknown target'); }
    if(!REL_TYPES.includes(rel))issues.push('bad rel_type');
    return {edge:{source,target,rel_type:REL_TYPES.includes(rel)?rel:'part_of'},issues};
  });
}
function renderEdgePreview(box,items){
  const valid=items.filter(x=>!x.issues.length).length, skipped=items.length-valid;
  const head='<div class="hint" style="margin-bottom:.4rem">'+valid+' of '+items.length+' importable links'+(skipped?(' · '+skipped+' skipped'):'')+'</div>';

  box.querySelector('#b_preview').innerHTML=head+'<div style="max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:.4rem"><table><thead><tr><th>Source</th><th>Rel</th><th>Target</th><th>Status</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>';
  const imp=box.querySelector('#b_import'); imp.disabled=valid===0; imp.textContent='Import '+valid+' link'+(valid===1?'':'s');
}

  const box=document.createElement('div'); box.className='overlay';
  box.innerHTML=`<div class="modal" style="max-width:720px">
    <h2>Bulk import items</h2>
    <p class="hint">Paste or choose a <b>CSV</b> or <b>JSON</b> ({nodes,edges} or an array of items). <b>Items CSV</b> columns: name, type, department, business_function, content/description, tools (comma-separated), props (JSON), id — any other column becomes a property. <b>Connections CSV</b>: columns source, target, rel_type (auto-detected). <a id="b_tmpl" href="#">Items template</a> · <a id="b_tmpl_edges" href="#">Connections template</a></p>
    <div class="grid2">
      <div class="field"><p class="label">Choose file</p><input id="b_file" type="file" accept=".csv,.json,text/csv,application/json"></div>
      <div class="field"><p class="label">Default type (blank/invalid)</p><select id="b_type">${TYPES.map(t=>'<option value="'+t+'"'+(t==='subagent'?' selected':'')+'>'+TYPE_LABEL[t]+'</option>').join('')}</select></div>
    </div>
    <div class="field"><p class="label">…or paste here</p><textarea id="b_text" class="mono" placeholder="name,type,department,content,tools&#10;SEO Sub-Agent,subagent,dept_growth,Draft SEO briefs,&quot;t_apollo,t_gsc&quot;"></textarea></div>
    <div style="display:flex;gap:.5rem"><button id="b_parse">Preview</button></div>
    <div id="b_preview" style="margin-top:.85rem"></div>
    <div id="b_err" class="err" style="display:none"></div>
    <div style="display:flex;gap:.5rem;margin-top:1rem"><button class="primary" id="b_import" disabled>Import</button><button id="b_cancel">Close</button></div>
  </div>`;
  overlay.appendChild(box);
  box.onclick=e=>{if(e.target===box)overlay.innerHTML='';};
  box.querySelector('#b_cancel').onclick=()=>overlay.innerHTML='';
  const dl=(csv,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();};
  box.querySelector('#b_tmpl').onclick=e=>{e.preventDefault();dl('name,type,department,business_function,content,tools\n"SEO Sub-Agent",subagent,dept_growth,core,"Plan and draft SEO content briefs","t_apollo,t_gsc"\n"Onboarding Agent",subagent,dept_hr,enabling,"Generate onboarding plans",t_asana\n','items-template.csv');};
  box.querySelector('#b_tmpl_edges').onclick=e=>{e.preventDefault();dl('source,target,rel_type\na_seo,t_apollo,uses\na_seo,sop_outbound,follows\na_seo,team_demandgen,member_of\n','connections-template.csv');};
  const fileInp=box.querySelector('#b_file');
  fileInp.onchange=()=>{const f=fileInp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{box.querySelector('#b_text').value=fr.result;};fr.readAsText(f);};

  let parsed=null,parsedEdges=null;
  box.querySelector('#b_parse').onclick=()=>{
    const errEl=box.querySelector('#b_err'); errEl.style.display='none';
    const text=box.querySelector('#b_text').value.trim();
    const defType=box.querySelector('#b_type').value;
    if(!text){errEl.textContent='Nothing to parse yet.';errEl.style.display='block';return;}
    parsedEdges=null;
    try{
      let items, asJson=null;
      try{asJson=JSON.parse(text);}catch(e){}
      if(asJson){
        const arr=Array.isArray(asJson)?asJson:(asJson.nodes||[]);
        items=arr.map(o=>{const node={type:TYPES.includes(o.type)?o.type:defType,name:(o.name||'').trim(),department:o.department==null?null:o.department,business_function:(o.business_function==='core'||o.business_function==='enabling')?o.business_function:null,content:o.content||'',props:o.props||{}};if(o.id)node.id=o.id;const issues=[];if(!node.name)issues.push('missing name');if(o.type&&!TYPES.includes(o.type))issues.push('type→'+defType);return {node,issues};});
        if(asJson.edges&&Array.isArray(asJson.edges))parsedEdges=asJson.edges.filter(e=>e.source&&e.target&&e.rel_type).map(e=>({source:e.source,target:e.target,rel_type:e.rel_type}));
      }else{
        const rows=parseCSV(text);
        if(rows.length<2){errEl.textContent='CSV needs a header row plus at least one data row.';errEl.style.display='block';return;}
        const hdr=rows[0].map(h=>h.trim().toLowerCase());
        if(hdr.includes('source')&&hdr.includes('target')){
          const ei=rowsToEdges(rows[0],rows.slice(1));
          parsed=[]; parsedEdges=ei.filter(x=>!x.issues.length).map(x=>x.edge);
          renderEdgePreview(box,ei);
          return;
        }
        items=rowsToNodes(rows[0],rows.slice(1),defType);
      }
      parsed=items;
      renderBulkPreview(box,items,parsedEdges);
    }catch(e){errEl.textContent='Parse error: '+e.message;errEl.style.display='block';}
  };
  box.querySelector('#b_import').onclick=async()=>{
    if(!parsed)return;
    const valid=parsed.filter(x=>!x.issues.includes('missing name'));
    const btn=box.querySelector('#b_import'); btn.disabled=true; btn.textContent='Importing…';
    try{
      const res=await runImport(valid,parsedEdges);
      overlay.innerHTML='';
      alert('Imported '+res.ok+' record(s)'+(res.fail?(' · '+res.fail+' skipped/failed'):'')+(state.mode==='local'?'.\nRemember to Export JSON to keep changes.':'.'));
    }catch(e){const errEl=box.querySelector('#b_err');errEl.textContent='Import failed: '+e.message;errEl.style.display='block';btn.disabled=false;}
  };
}

// ---------- wire up ----------
$('#btnAdd').onclick=()=>openEditor(null);
$('#btnSettings').onclick=openSettings;
$('#btnExport').onclick=exportJson;
$('#btnImport').onclick=importJson;
$('#btnBulk').onclick=openBulk;
$('#search').oninput=e=>{state.search=e.target.value;render();};

load();
</script>
</body>
</html>
