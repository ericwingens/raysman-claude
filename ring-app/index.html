<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ring meApp — Match. Ring. Connect.</title>
<style>
/* ============================================================
   RING — Dating trifft Creator-Economy
   Design tokens (light + dark), warm-biased neutrals
   ============================================================ */
:root{
  --orange:#F5761A;            /* brand / primary CTA */
  --orange-ink:#C9560A;
  --amber:#FDB43C;
  --red:#F5471F;
  --heart:#FF3D71;             /* the dating spark */
  --live:#25C26E;
  --gold:#E7A419;

  --ink:#17130F;               /* near-black, warm */
  --ink-2:#4A423B;
  --muted:#8B8680;             /* warm grey */
  --line:#EFE9E2;
  --paper:#FFFFFF;
  --cream:#FFF8F2;             /* warm section ground */
  --card:#FFFFFF;
  --card-2:#FBF6F0;
  --shadow:0 18px 44px -18px rgba(60,32,8,.34);
  --shadow-sm:0 8px 22px -12px rgba(60,32,8,.30);
  --brand-grad:linear-gradient(135deg,var(--amber),var(--orange) 46%,var(--red));
  --radius:22px;
  --safe-top:14px;
}
/* Ring commits to the light look of the original Figma design — no dark theme.
   Explicit light tokens also on [data-theme="dark"] so a viewer's dark toggle can't darken the app. */
:root[data-theme="light"],:root[data-theme="dark"]{
  --ink:#17130F; --ink-2:#4A423B; --muted:#8B8680; --line:#EFE9E2;
  --paper:#FFFFFF; --cream:#FFF8F2; --card:#FFFFFF; --card-2:#FBF6F0;
  --shadow:0 18px 44px -18px rgba(60,32,8,.34); --shadow-sm:0 8px 22px -12px rgba(60,32,8,.30);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif; color:var(--ink); background:radial-gradient(1200px 700px at 15% -10%, rgba(253,180,60,.16), transparent 60%), radial-gradient(1000px 700px at 110% 10%, rgba(245,71,31,.13), transparent 55%),#EDE6DE; -webkit-font-smoothing:antialiased;}
button{font-family:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Phone shell ---------- */
.phone{
  width:min(430px,96vw); height:min(920px,92vh); position:relative;
  background:var(--paper); border-radius:44px; overflow:hidden;
  box-shadow:var(--shadow), 0 0 0 10px #0b0906, 0 0 0 12px rgba(255,255,255,.06);
  display:flex;flex-direction:column;
}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#0b0906;border-bottom-left-radius:16px;border-bottom-right-radius:16px;z-index:60}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 4px;font-size:13px;font-weight:600;color:var(--ink);z-index:40}
.statusbar .dots{display:flex;gap:5px;align-items:center}
.statusbar .bar{width:17px;height:11px;border:1.4px solid var(--ink);border-radius:3px;position:relative}
.statusbar .bar::after{content:"";position:absolute;inset:1.6px;right:5px;background:var(--ink);border-radius:1px}

/* ---------- App scaffold ---------- */
.app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.pad{padding:6px 18px 120px}

.appbar{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;gap:12px}
.appbar h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.appbar .sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;transition:transform .15s, background .2s}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:20px;height:20px}

/* wallet chip */
.wallet-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--brand-grad);color:#fff;font-weight:700;font-size:13.5px;border:none;cursor:pointer;box-shadow:var(--shadow-sm)}
.wallet-chip:active{transform:scale(.96)}
.wallet-chip .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff6,transparent 60%),#fff3;display:grid;place-items:center;font-size:10px}
.wallet-chip .coin svg{width:11px;height:11px}

/* ---------- Brand / original ring swirl logo ---------- */
.brandrow{display:flex;align-items:center;gap:10px}
.ringmark{flex:none;display:block}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 9px;border:none;cursor:pointer;font-weight:700;font-size:16px;padding:15px 16px;border-radius:999px;transition:transform .14s, filter .2s;width:100%;min-width:0}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--brand-grad);color:#fff;box-shadow:0 12px 26px -12px rgba(245,118,26,.75)}
.btn-ghost{background:var(--card-2);color:var(--ink);border:1px solid var(--line)}
.btn-outline{background:transparent;color:var(--orange);border:1.6px solid var(--orange)}
.btn svg{width:19px;height:19px}
.btn-sm{padding:10px 12px;font-size:13.5px}

/* ---------- Segmented ---------- */
.seg{display:flex;gap:4px;background:var(--card-2);border:1px solid var(--line);padding:4px;border-radius:999px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;padding:9px 0;border-radius:999px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- Discover swipe cards ---------- */
.deck{position:relative;height:560px;margin:6px 4px 0;touch-action:pan-y}
.swipe{position:absolute;inset:0;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);will-change:transform;user-select:none;cursor:grab;background:#222}
.swipe .photo{position:absolute;inset:0}
.swipe .grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,6,2,.15) 58%,rgba(10,6,2,.85))}
.swipe .meta{position:absolute;left:0;right:0;bottom:0;padding:20px;color:#fff}
.swipe .name{font-size:26px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.swipe .name .age{font-weight:500;opacity:.92}
.swipe .row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fff}
.chip svg{width:13px;height:13px}
.chip.live{background:var(--live)}
.chip.price{background:rgba(0,0,0,.42)}
.badge-verif{color:#fff;background:#3B9CFF;border-radius:50%;width:19px;height:19px;display:inline-grid;place-items:center;flex:none}
.badge-verif svg{width:12px;height:12px}
.tag{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff}
.stamp{position:absolute;top:34px;font-size:34px;font-weight:900;letter-spacing:.04em;padding:6px 16px;border:4px solid;border-radius:14px;opacity:0;transform:rotate(-16deg);pointer-events:none}
.stamp.like{left:22px;color:var(--live);border-color:var(--live)}
.stamp.nope{right:22px;color:var(--heart);border-color:var(--heart);transform:rotate(16deg)}

.deck-actions{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:16px}
.round{border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm);transition:transform .14s}
.round:active{transform:scale(.9)}
.round svg{width:24px;height:24px}
.round.lg{width:66px;height:66px}
.round.md{width:54px;height:54px}
.round.pass svg{color:var(--heart)}
.round.like{background:var(--brand-grad)}.round.like svg{color:#fff;width:30px;height:30px}
.round.dial{background:var(--live)}.round.dial svg{color:#fff}
.round.star svg{color:var(--gold)}

/* ---------- Generic cards / lists ---------- */
.section-title{font-size:15px;font-weight:800;margin:20px 2px 12px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between}
.section-title a{color:var(--orange);font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

.story{flex:none;width:70px;text-align:center;cursor:pointer}
.story .av{width:64px;height:64px;border-radius:50%;padding:3px;background:var(--brand-grad);margin:0 auto}
.story .av.seen{background:var(--line)}
.story .av > div{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--paper);background-size:cover;position:relative;overflow:hidden}
.story .lv{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);background:var(--live);color:#fff;font-size:8.5px;font-weight:800;padding:1.5px 6px;border-radius:999px;border:1.5px solid var(--paper)}
.story .nm{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.creator-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccard{border-radius:18px;overflow:hidden;position:relative;aspect-ratio:3/4;box-shadow:var(--shadow-sm);cursor:pointer;background:#222}
.ccard .grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,4,1,.82))}
.ccard .top{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between}
.ccard .bot{position:absolute;left:11px;right:11px;bottom:11px;color:#fff}
.ccard .bot .n{font-weight:800;font-size:15px;display:flex;align-items:center;gap:5px}
.ccard .bot .s{font-size:11.5px;opacity:.9;display:flex;align-items:center;gap:5px;margin-top:3px}

/* ---------- Feed ---------- */
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.post-head{display:flex;align-items:center;gap:11px;padding:13px 14px}
.avatar{width:44px;height:44px;border-radius:50%;background-size:cover;flex:none;position:relative}
.avatar.ring{padding:2px;background:var(--brand-grad)}
.avatar.ring > div{width:100%;height:100%;border-radius:50%;border:2px solid var(--card);background-size:cover}
.post-head .n{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:5px}
.post-head .t{font-size:12px;color:var(--muted)}
.post-media{position:relative;aspect-ratio:4/5;background:#222}
.post-media .locked{position:absolute;inset:0;display:grid;place-items:center;gap:12px;color:#fff;text-align:center;padding:24px;background:rgba(10,6,2,.30);backdrop-filter:blur(18px)}
.post-media .locked .lk{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.post-media .locked .lk svg{width:26px;height:26px}
.post-media .locked h4{margin:0;font-size:17px;font-weight:800}
.post-media .locked p{margin:0;font-size:13px;opacity:.85;max-width:230px}
.post-actions{display:flex;align-items:center;gap:18px;padding:12px 15px 6px;color:var(--ink)}
.post-actions .a{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;cursor:pointer}
.post-actions .a svg{width:23px;height:23px}
.post-actions .a.on svg{color:var(--heart);fill:var(--heart)}
.post-actions .spacer{margin-left:auto}
.post-cap{padding:2px 15px 15px;font-size:14px;line-height:1.45}
.post-cap b{font-weight:700}

/* ---------- Chats ---------- */
.chat-row{display:flex;align-items:center;gap:13px;padding:12px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
.chat-row .n{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.chat-row .last{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.chat-row .meta{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.chat-row .time{font-size:11.5px;color:var(--muted)}
.pill-unread{background:var(--brand-grad);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 6px}
.presence{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--live);border:2.5px solid var(--card)}

/* ---------- Sheet / modal ---------- */
.sheet-scrim{position:absolute;inset:0;background:rgba(8,4,1,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:84;backdrop-filter:blur(2px)}
.sheet-scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;background:var(--paper);border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);z-index:85;display:flex;flex-direction:column;overflow:hidden}
.sheet.show{transform:translateY(0)}
.sheet .grip{width:40px;height:5px;border-radius:999px;background:var(--line);margin:9px auto 2px;flex:none}
.sheet-body{overflow-y:auto;scrollbar-width:none;padding:6px 18px 26px}
.sheet-body::-webkit-scrollbar{display:none}

/* full screen sheet (profile / call) */
.full{position:absolute;inset:0;background:var(--paper);z-index:86;transform:translateX(100%);transition:transform .34s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;overflow:hidden}
.full.show{transform:translateX(0)}
.full .fscreen{flex:1;overflow-y:auto;scrollbar-width:none}
.full .fscreen::-webkit-scrollbar{display:none}
.back{position:absolute;top:calc(var(--safe-top) + 30px);left:16px;z-index:5}

/* profile header */
.phero{position:relative;height:420px;background:#222}
.phero .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,4,1,.2) 0,transparent 30% 55%,rgba(8,4,1,.9))}
.phero .info{position:absolute;left:18px;right:18px;bottom:18px;color:#fff}
.phero .nm{font-size:29px;font-weight:800;display:flex;align-items:center;gap:8px}
.stat-row{display:flex;gap:22px;padding:16px 18px;border-bottom:1px solid var(--line)}
.stat-row .s b{font-size:18px;font-weight:800;display:block}
.stat-row .s span{font-size:12px;color:var(--muted)}

.tier{border:1.6px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;position:relative;background:var(--card)}
.tier.best{border-color:var(--orange);box-shadow:0 10px 30px -16px rgba(245,118,26,.6)}
.tier .badge{position:absolute;top:-11px;right:14px;background:var(--brand-grad);color:#fff;font-size:11px;font-weight:800;padding:4px 11px;border-radius:999px}
.tier .tn{font-weight:800;font-size:16px}
.tier .tp{font-weight:800;font-size:22px;margin:6px 0 2px}
.tier .tp span{font-size:13px;color:var(--muted);font-weight:600}
.tier ul{list-style:none;padding:0;margin:10px 0 14px;display:flex;flex-direction:column;gap:7px}
.tier li{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.tier li svg{width:16px;height:16px;color:var(--live);flex:none}

.gallery{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.gitem{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;background:#222;cursor:pointer}
.gitem .lock{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,4,1,.32);backdrop-filter:blur(12px);color:#fff}
.gitem .pv{position:absolute;bottom:6px;left:6px;font-size:10px;font-weight:800;background:rgba(0,0,0,.5);color:#fff;padding:3px 7px;border-radius:999px}

/* ---------- Call screen ---------- */
.call{position:absolute;inset:0;z-index:80;transform:translateY(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);overflow:hidden;color:#fff}
.call.show{transform:translateY(0)}
.call .bg{position:absolute;inset:0}
.call .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,3,1,.55),rgba(6,3,1,.2) 30%,rgba(6,3,1,.85))}
.call .top{position:absolute;top:calc(var(--safe-top) + 30px);left:0;right:0;text-align:center}
.call .who{font-size:24px;font-weight:800}
.call .status{font-size:13.5px;opacity:.85;margin-top:3px}
.call .ticker{display:inline-flex;flex-direction:column;align-items:center;margin-top:16px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border-radius:18px;padding:12px 22px;border:1px solid rgba(255,255,255,.15)}
.call .ticker .cost{font-size:30px;font-weight:800;letter-spacing:-.01em}
.call .ticker .rate{font-size:11.5px;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
.call .self{position:absolute;top:calc(var(--safe-top) + 30px);right:16px;width:96px;height:132px;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.4);box-shadow:var(--shadow)}
.call .controls{position:absolute;left:0;right:0;bottom:40px;display:flex;flex-direction:column;gap:16px;align-items:center;padding:0 24px}
.call .ctrow{display:flex;gap:18px;justify-content:center}
.call .cbtn{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:none;color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .14s}
.call .cbtn:active{transform:scale(.9)}
.call .cbtn.end{background:var(--heart)}
.call .cbtn.tip{background:var(--brand-grad)}
.call .cbtn svg{width:24px;height:24px}

/* ---------- Bottom tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;padding:9px 8px calc(env(safe-area-inset-bottom,10px) + 12px);background:color-mix(in srgb,var(--paper) 88%, transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:50}
.tab{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:700;padding:4px 8px;flex:1;position:relative}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--orange)}
.tab .dot{position:absolute;top:1px;right:calc(50% - 16px);width:8px;height:8px;background:var(--heart);border-radius:50%;border:1.5px solid var(--paper)}
.tab.center{flex:0}
.tab.center .fab{width:52px;height:52px;border-radius:50%;background:var(--brand-grad);display:grid;place-items:center;color:#fff;box-shadow:0 12px 24px -10px rgba(245,118,26,.8);margin-bottom:2px;margin-top:-14px}
.tab.center .fab svg{width:26px;height:26px}

/* ---------- Onboarding (welcome screen per Figma) ---------- */
.onb{position:absolute;inset:0;z-index:90;background:var(--paper);display:flex;flex-direction:column;transition:opacity .4s, transform .4s}
.onb.hide{opacity:0;transform:scale(.98);pointer-events:none}
.onb .cluster{position:relative;flex:1;min-height:0;overflow:hidden}
.onb .cin{position:absolute;left:50%;top:0;width:428px;height:500px;transform:translateX(-50%)}
.onb .peach{position:absolute;border-radius:50%}
.onb .pp{position:absolute;border-radius:50%;background-size:cover;background-position:center 20%;box-shadow:0 14px 30px -14px rgba(60,32,8,.35);border:4px solid var(--paper)}
.onb .heart-i{position:absolute;color:var(--heart);opacity:.9}
.onb .heart-i svg{width:100%;height:100%;display:block}
.onb .odot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--orange);opacity:.9}
.onb .content{padding:0 26px 14px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.onb .content p{color:var(--muted);font-size:14px;line-height:1.55;margin:0;max-width:330px}
.onb .fine{font-size:12.5px;color:var(--muted)}
.onb .footer{padding:6px 0 14px;text-align:center;font-size:12px;color:var(--muted)}
.onb .footer a{color:var(--muted);text-decoration:none;cursor:pointer}
.onb .homebar{width:140px;height:5px;border-radius:999px;background:var(--ink);opacity:.85;margin:12px auto 8px}
.link{color:var(--ink);font-weight:700;cursor:pointer}

/* ---------- Profil bearbeiten ---------- */
.ftop{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-top) + 30px) 16px 12px;border-bottom:1px solid var(--line);flex:none}
.ftop h3{flex:1;text-align:center;margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.savebtn{background:none;border:none;color:var(--orange);font-weight:800;font-size:14.5px;cursor:pointer;padding:8px 4px;min-width:42px}
.rfoot{padding:12px 18px calc(env(safe-area-inset-bottom,10px) + 14px);border-top:1px solid var(--line);background:var(--paper);flex:none}
.flbl{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.camfab{position:absolute;right:-2px;bottom:-2px;width:36px;height:36px;border-radius:50%;border:3px solid var(--paper);background:var(--brand-grad);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-sm)}
.camfab svg{width:17px;height:17px}
.complete{background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px}
.complete .crow{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:8px}
.cbar{height:7px;border-radius:999px;background:var(--line);overflow:hidden}
.cbar i{display:block;height:100%;border-radius:999px;background:var(--brand-grad)}
.minph{flex:none;width:76px;height:100px;border-radius:14px;background-size:cover;background-position:center 20%;position:relative;cursor:pointer;box-shadow:var(--shadow-sm)}
.minph.add{display:grid;place-items:center;border:1.6px dashed var(--line);background:var(--card-2);color:var(--muted);font-size:26px;box-shadow:none}
.mainbadge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:999px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line)}
.set-row .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.set-row .lbl svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.set-row .val{font-size:14.5px;font-weight:600;margin-top:3px}
.set-row .pen{color:var(--orange);cursor:pointer}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.ichip{border:1.6px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 15px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.ichip.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%, var(--card));color:var(--orange-ink);font-weight:700}
.sw{width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s;cursor:pointer}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--orange)}
.sw.on i{transform:translateX(19px)}
.warnbox{background:color-mix(in srgb,var(--gold) 12%, var(--card));border:1px solid color-mix(in srgb,var(--gold) 35%, var(--line));border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.5;margin:14px 0}
.wave{display:flex;align-items:center;justify-content:center;gap:2.5px;height:70px}
.wave i{display:block;width:3px;border-radius:2px;background:var(--orange);opacity:.9}
.wave i.off{background:var(--line)}
.rec-time{font-size:26px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0 2px}
.rec-btn{width:74px;height:74px;border-radius:50%;border:2px solid var(--orange);background:var(--card);display:grid;place-items:center;color:var(--orange);cursor:pointer;margin:12px auto;transition:.2s}
.rec-btn.on{background:var(--brand-grad);color:#fff;border-color:transparent;box-shadow:0 0 0 8px color-mix(in srgb,var(--orange) 18%, transparent)}
.rec-btn svg{width:28px;height:28px}
.opt{display:flex;align-items:center;gap:12px;border:1.6px solid var(--line);background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;font-weight:600;transition:.15s}
.opt.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 10%, var(--card))}
.opt svg{width:20px;height:20px}

/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);z-index:95;opacity:0;transition:.3s;max-width:82%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.money{font-weight:800;font-variant-numeric:tabular-nums}
.center{text-align:center}
.muted{color:var(--muted)}
.hearts-fly{position:absolute;pointer-events:none;z-index:100}

.field{width:100%;border:1.6px solid var(--line);background:var(--card-2);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--ink);margin-bottom:10px}
.field:focus{outline:none;border-color:var(--orange)}
.amt-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.amt{flex:1;min-width:70px;border:1.6px solid var(--line);background:var(--card-2);border-radius:14px;padding:14px 6px;text-align:center;font-weight:800;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink);transition:.15s}
.amt:hover{border-color:var(--muted)}
.amt.on{border-color:var(--orange);border-width:2px;color:var(--orange-ink);background:color-mix(in srgb,var(--orange) 14%, var(--card));box-shadow:0 6px 16px -8px rgba(245,118,26,.55)}

/* ---------- Ported from the React stylesheet so both versions stay in step:
   register flow, explore rows, modals, legal pages, photo grid. ---------- */
.onb h2{font-size:29px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.12}
.onb .fine b{color:var(--orange)}
.reg{position:absolute;inset:0;z-index:88;background:var(--paper);display:flex;flex-direction:column}
.reg .rtop{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-top) + 30px) 18px 6px}
.reg .prog{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.reg .prog i{display:block;height:100%;background:var(--brand-grad);transition:width .3s}
.reg .rbody{flex:1;overflow-y:auto;scrollbar-width:none;padding:18px 26px 20px}
.reg .rbody::-webkit-scrollbar{display:none}
.reg h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px;text-wrap:balance}
.reg .rfoot{padding:10px 26px calc(env(safe-area-inset-bottom,10px) + 16px)}
.opt .em{font-size:22px}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chipset .c{border:1.6px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
.chipset .c.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%, var(--card));color:var(--orange-ink)}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.lrow .nm{font-weight:700;font-size:15px}
.lrow .loc{font-size:12px;color:var(--muted);margin-top:2px}
.lrow .acts{margin-left:auto;display:flex;gap:9px}
.rowbtn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;color:#fff;background:var(--brand-grad);box-shadow:0 6px 14px -6px rgba(245,118,26,.7);transition:transform .14s}
.rowbtn:active{transform:scale(.9)}
.rowbtn svg{width:18px;height:18px}
.rowbtn.ghost{background:var(--card);border:1.6px solid var(--orange);color:var(--orange);box-shadow:none}
.rowbtn.playing{animation:pulse 1.1s ease-in-out infinite}
.modal{position:absolute;inset:0;display:grid;place-items:center;z-index:94;padding:30px}
.modal .mbox{background:var(--paper);border-radius:22px;padding:22px;box-shadow:var(--shadow);width:100%;max-width:320px;text-align:center;transform:scale(.94);opacity:0;transition:.25s}
.modal.show .mbox{transform:scale(1);opacity:1}
.modal .mbox h3{margin:0 0 8px;font-size:18px;font-weight:800}
.modal .mbox p{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.5}
.modal .mrow{display:flex;gap:10px}
.modal .mrow .btn{width:auto;flex:1 1 auto;min-width:0}
.legal h3{font-size:15px;font-weight:800;margin:18px 0 6px}
.legal p{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:0 0 10px}
.photo-grid{display:flex;gap:8px;margin:10px 0}
.photo-grid .ph{width:64px;height:64px;border-radius:12px;background-size:cover;position:relative}
.photo-grid .ph .rm{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:10px;cursor:pointer}
.mainbadge.sm{font-size:8.5px;padding:2px 6px}
.ph.add{display:grid;place-items:center;border:1.6px dashed var(--line);background:var(--card-2);color:var(--muted);font-size:28px;cursor:pointer}
.gitem .lock svg{width:22px;height:22px}

/* ---------- Marketplace layer: trust metrics, level, badges ---------- */
.trust{display:flex;gap:8px;margin:12px 0 2px}
.trust .t{flex:1;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.trust .t b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.trust .t span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.lvl{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0 2px}
.lvl .pip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-grad);color:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;box-shadow:var(--shadow-sm)}
.badge-pill{display:inline-flex;align-items:center;gap:5px;border:1.6px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:700;color:var(--ink-2)}

/* ---------- Service packages, availability calendar, bookings ---------- */
.svc{display:flex;gap:12px;align-items:center;border:1.6px solid var(--line);background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .15s}
.svc:active{transform:scale(.99)}
.svc.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 8%, var(--card))}
.svc .sv-n{font-weight:800;font-size:14.5px}
.svc .sv-d{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.svc .sv-p{margin-left:auto;text-align:right;flex:none}
.svc .sv-p b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.svc .sv-p span{font-size:11px;color:var(--muted);font-weight:600}
.daystrip{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.daystrip::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;border:1.6px solid var(--line);background:var(--card);border-radius:14px;padding:8px 0;text-align:center;cursor:pointer}
.day.on{border-color:var(--orange);background:var(--brand-grad);color:#fff}
.day .dw{font-size:11px;font-weight:700;opacity:.8}
.day .dn{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.day.off{opacity:.4;cursor:default}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.slot{border:1.6px solid var(--line);background:var(--card);border-radius:999px;padding:9px 15px;font-weight:700;font-size:13.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.slot.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%, var(--card));color:var(--orange-ink)}
.bk-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.bk-row .bk-when{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);font-weight:600;flex:none}
.bk-row .bk-when b{display:block;color:var(--ink);font-size:13.5px;font-variant-numeric:tabular-nums}

/* ---------- Reviews and the post-call rating prompt ---------- */
.rv{display:flex;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line)}
.rv .rv-av{width:34px;height:34px;border-radius:50%;flex:none;background:var(--card-2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.rv .rv-n{font-weight:700;font-size:13.5px}
.rv .rv-w{font-size:11.5px;color:var(--muted);margin-left:6px;font-weight:600}
.rv p{margin:4px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.stars{display:inline-flex;gap:2px;color:var(--gold);vertical-align:-1px}
.stars svg{width:13px;height:13px}
.stars.big{gap:8px}
.stars.big svg{width:34px;height:34px}
.stars .off{color:var(--line)}
.rate-pick{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.rate-pick button{border:none;background:none;padding:2px;cursor:pointer;color:var(--line);line-height:0}
.rate-pick button.on{color:var(--gold)}
.rate-pick svg{width:34px;height:34px}

/* ---------- Virtual gifts and the creator leaderboard ---------- */
.giftgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:8px 0 4px;max-height:46vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:2px}
.giftgrid::-webkit-scrollbar{display:none}
.giftcard{border:1.6px solid var(--line);background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer}
.giftcard.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 10%, var(--card))}
.giftcard .g-em{font-size:28px;line-height:1.1}
.giftcard .g-n{font-size:11.5px;font-weight:700;margin-top:4px;line-height:1.25}
.giftcard .g-p{font-size:11.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.giftfly{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);font-size:54px;pointer-events:none;z-index:120;animation:giftup 1.6s ease-out forwards}
@keyframes giftup{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-190px) scale(1)}}
.lbrow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.lbrow .rank{width:26px;flex:none;text-align:center;font-weight:800;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.lbrow .rank.top{color:var(--gold)}
.lbrow .lb-n{font-weight:700;font-size:14.5px}
.lbrow .lb-s{font-size:12px;color:var(--muted);margin-top:2px}
.lbrow .lb-sc{margin-left:auto;flex:none;text-align:right;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.lbrow .lb-sc span{display:block;font-size:10.5px;color:var(--muted);font-weight:600}

/* Amounts inside a button label must never break mid-price. Where a button is
   still too narrow (the phone frame is min(430px,96vw)), it now breaks before
   the amount instead of splitting "4,99" from "€". */
.btn .btn-amt{white-space:nowrap;font-size:.85em;opacity:.92;font-weight:700}

/* ---------- Share sheet ---------- */
.sharegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px;margin:10px 0 2px}
.sharetile{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:none;padding:0;font:inherit}
.sharetile .tile{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.sharetile .tile svg{width:26px;height:26px}
.sharetile .lbl2{font-size:11px;font-weight:700;color:var(--ink-2);line-height:1.2}
.sharetile:active .tile{transform:scale(.93)}

/* ---------- Extra participants in a call ---------- */
.parts{position:absolute;top:calc(var(--safe-top) + 174px);right:16px;display:flex;flex-direction:column;gap:8px;z-index:6}
.part{width:56px;height:74px;border-radius:14px;background-size:cover;background-position:center;position:relative;box-shadow:0 6px 18px -8px rgba(0,0,0,.7);border:1.5px solid rgba(255,255,255,.35)}
.part .pn{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;font-weight:700;color:#fff;text-align:center;padding:2px 0 3px;background:linear-gradient(transparent,rgba(0,0,0,.75));border-radius:0 0 13px 13px}
.part .drop{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:11px;cursor:pointer;border:1.5px solid var(--paper)}
.pickrow{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.pickrow .pk-n{font-weight:700;font-size:14.5px}
.pickrow .pk-s{font-size:12px;color:var(--muted);margin-top:2px}
.pickrow .pk-c{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.pickrow.on .pk-c{border-color:var(--orange);background:var(--orange);color:#fff}
.pickrow.on .pk-c svg{width:14px;height:14px}
.pickrow.full{opacity:.4;pointer-events:none}
</style>
</head>

      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.5c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8.5.5 10.4 10.4 0 0 0 1.3 3.6L2.5 4.9A8.4 8.4 0 0 1 8.5 2.5Zm0 3.6c1.3 0 2.5.5 3.4 1.4l1.3-1.3A6.3 6.3 0 0 0 8.5 4.1a6.3 6.3 0 0 0-4.7 2.1L5.1 7.5c.9-.9 2.1-1.4 3.4-1.4Zm0 3.5L10.3 11 8.5 12 6.7 11l1.8-1.4Z"/></svg>
      <span class="bar"></span>

<script>
"use strict";
/* =========================================================================
   RING — prototype logic. Self-contained, no external resources.
   Photos are deterministic mesh-gradient placeholders (CSP-safe).
   ========================================================================= */

/* ---- gradient "photo" generator (stable per seed) ---- */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function grad(seed){
  const h=hashStr(seed), a=h%360, b=(a+40+h%60)%360, c=(a+180+h%40)%360;
  return `radial-gradient(120% 100% at 20% 12%, hsl(${a} 78% 66%), transparent 55%),`+
         `radial-gradient(120% 120% at 88% 20%, hsl(${b} 72% 58%), transparent 55%),`+

// Leaderboard score: delivered calls weighted by rating, so quality beats volume.
const leaderboard = (all = REVIEWS) =>
  CREATORS.map((c) => {
    const st = STATS[c.id], r = rating(c.id, all);
    return { ...c, score: Math.round(st.calls * (r.avg || 4) * (st.completion / 100)) };
  }).sort((a, b) => b.score - a.score);

/* Availability: seven days from today, a few slots each. Deterministic per
   creator so the calendar looks stable across re-renders. */
const DAYS = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const SLOT_POOL = ["09:00", "11:00", "13:00", "15:00", "17:00", "19:00", "21:00"];

function availability(id, dayOffset) {
  let h = 0;
  for (const ch of id + dayOffset) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return SLOT_POOL.filter((_, i) => (h >> i) & 1);
}

function dayLabel(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return { key: offset, dow: DAYS[d.getDay()], num: d.getDate(), today: offset === 0 };
}

const app=document.getElementById("app");

/* ---- helpers ---- */
function toast(msg){
  let t=document.querySelector(".toast");
  if(!t){t=document.createElement("div");t.className="toast";document.getElementById("phone").appendChild(t)}
  t.textContent=msg;requestAnimationFrame(()=>t.classList.add("show"));
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);
}
function updateBalance(delta){state.balance=Math.max(0,state.balance+delta);document.querySelectorAll("[data-bal]").forEach(e=>e.textContent=EUR(state.balance));}

/* =========================================================================
   MAIN VIEWS
   ========================================================================= */
function render(){
  let html=`<div class="screen" id="screen"><div class="pad" id="pad"></div></div>${tabbar()}`;
  app.innerHTML=html;
  const pad=document.getElementById("pad");
  ({discover:renderDiscover,explore:renderExplore,feed:renderFeed,chats:renderChats,me:renderMe}[state.view])(pad);
}

function tabbar(){
  const t=(v,ic,label,dot)=>`<button class="tab ${state.view===v?'on':''}" onclick="go('${v}')">${ic}${dot?'<span class="dot"></span>':''}<span>${label}</span></button>`;
  return `<nav class="tabbar">
    ${t("discover",I.layers,"Discover")}
    ${t("explore",I.compass,"Explore")}
    <button class="tab center" onclick="go('feed')"><span class="fab">${I.plus}</span></button>
    ${t("chats",I.chat,"Chats",true)}
    ${t("me",I.user,"Me")}
  </nav>`;
}
function go(v){state.view=v;render();document.getElementById("screen").scrollTop=0;}

/* ---------- DISCOVER (swipe deck) ---------- */
function renderDiscover(pad){
  pad.innerHTML=`
  <div class="appbar" style="padding:6px 0 10px">
    <div><div class="brandrow">${ringLockup(42)}</div>
    <div class="sub">Menschen & Creator in deiner Nähe</div></div>
    <button class="wallet-chip" onclick="openWallet()"><span class="coin">${I.bolt}</span><span data-bal>${EUR(state.balance)}</span></button>
  </div>
  <div class="deck" id="deck"></div>
  <div class="deck-actions">
    <button class="round md pass" onclick="swipe('left')" aria-label="Pass">${I.x}</button>
    <button class="round md dial" onclick="afterSwipeCall()" aria-label="Anrufen">${I.phone}</button>
    <button class="round lg like" onclick="swipe('right')" aria-label="Like">${I.heart}</button>
    <button class="round md star" onclick="superLike()" aria-label="Super Ring">${I.star}</button>
  </div>
  <p class="center muted" style="font-size:11.5px;margin-top:14px">Anrufe über die Ring-Funktion kosten je nach Creator ab 0,99 €/Min.</p>`;
  buildDeck();
}
function buildDeck(){
  const deck=document.getElementById("deck");if(!deck)return;
  deck.innerHTML="";
  const list=CREATORS.slice(state.deckIdx,state.deckIdx+3).reverse();
  if(list.length===0){deck.innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px"><div><div style="font-size:40px">🎉</div><p style="font-weight:700;color:var(--ink)">Das war's für heute!</p><p style="font-size:13px">Schau später wieder rein für neue Vorschläge.</p><button class="btn btn-outline btn-sm" style="width:auto" onclick="state.deckIdx=0;buildDeck()">Neu starten</button></div></div>`;return;}
  list.forEach((c,i)=>{
    const top=i===list.length-1;
    const el=document.createElement("div");
    el.className="swipe";el.dataset.cid=c.id;
    el.style.transform=`scale(${1-(list.length-1-i)*0.04}) translateY(${(list.length-1-i)*-10}px)`;
    el.innerHTML=`
      <div class="photo" style="${photoStyle(c.id)}"></div>
      <div class="grad"></div>
      <div class="stamp like">RING</div><div class="stamp nope">NOPE</div>
      <div class="meta">
        <div class="name">${c.name} <span class="age">${c.age}</span> ${c.verified?`<span class="badge-verif">${I.verif}</span>`:""}</div>
        <div class="row">
          ${c.live?`<span class="chip live">● LIVE</span>`:c.online?`<span class="chip"><span style="width:7px;height:7px;background:var(--live);border-radius:50%"></span>Online</span>`:`<span class="chip">${c.dist} km entfernt</span>`}
          <span class="chip price">${I.phone} ${EUR(c.rate)}/Min</span>
        </div>
        <div class="row">${c.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>`;
    if(top){el.onclick=(e)=>{if(!el._moved)openProfile(c.id)};attachDrag(el);}
    deck.appendChild(el);
  });
}
function attachDrag(el){
  let sx=0,sy=0,dx=0,dy=0,drag=false;
  const down=(x,y)=>{drag=true;sx=x;sy=y;el._moved=false;el.style.transition="none";el.style.cursor="grabbing";};
  const move=(x,y)=>{if(!drag)return;dx=x-sx;dy=y-sy;if(Math.abs(dx)>6)el._moved=true;
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx*0.05}deg)`;
    el.querySelector(".stamp.like").style.opacity=Math.max(0,dx/120);
    el.querySelector(".stamp.nope").style.opacity=Math.max(0,-dx/120);};
  const up=()=>{if(!drag)return;drag=false;el.style.cursor="grab";el.style.transition="transform .3s";
    if(dx>110){fly(dx,dy,"right");}else if(dx<-110){fly(dx,dy,"left");}
    else{el.style.transform="";el.querySelector(".stamp.like").style.opacity=0;el.querySelector(".stamp.nope").style.opacity=0;}
    dx=dy=0;};
  const fly=(x,y,dir)=>{el.style.transform=`translate(${dir==="right"?600:-600}px,${y}px) rotate(${dir==="right"?30:-30}deg)`;
    setTimeout(()=>doSwipe(dir),260);};
  el.addEventListener("pointerdown",e=>{el.setPointerCapture(e.pointerId);down(e.clientX,e.clientY)});
  el.addEventListener("pointermove",e=>move(e.clientX,e.clientY));
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}
function swipe(dir){const deck=document.getElementById("deck");const top=deck&&deck.lastElementChild;
  if(top&&top.classList.contains("swipe")){top.style.transition="transform .3s";top.style.transform=`translate(${dir==="right"?600:-600}px,0) rotate(${dir==="right"?30:-30}deg)`;setTimeout(()=>doSwipe(dir),240);}}
function doSwipe(dir){
  const c=CREATORS[state.deckIdx];
  if(dir==="right"&&c){state.liked.add(c.id);heartBurst();toast(`Du hast ${c.name} geliked 💛`);}
  state.deckIdx++;buildDeck();
}
function superLike(){const c=CREATORS[state.deckIdx];if(!c)return;toast(`Super Ring an ${c.name}! ⭐ Sie wird's zuerst sehen.`);state.deckIdx++;buildDeck();}
function afterSwipeCall(){const c=CREATORS[state.deckIdx];if(!c)return;startCall(c.id,"video");}
function heartBurst(){
  const wrap=document.createElement("div");wrap.className="hearts-fly";wrap.style.left="50%";wrap.style.top="55%";
  document.getElementById("phone").appendChild(wrap);
  for(let i=0;i<8;i++){const h=document.createElement("div");h.textContent="❤";h.style.cssText=`position:absolute;font-size:${14+Math.random()*16}px;color:var(--heart)`;
    wrap.appendChild(h);const ang=Math.random()*Math.PI*2,d=40+Math.random()*80;
    h.animate([{transform:"translate(0,0) scale(.4)",opacity:1},{transform:`translate(${Math.cos(ang)*d}px,${Math.sin(ang)*d-40}px) scale(1.2)`,opacity:0}],{duration:900,easing:"cubic-bezier(.2,.7,.3,1)"});}
  setTimeout(()=>wrap.remove(),950);
}

   (voice intro + like) that the React Explore screen has. */

  return `<div class="section-title">In deiner Nähe</div>` + CREATORS.map(c=>`
    <div class="lrow">
      <div class="avatar" style="${photoStyle(c.id)}" onclick="openProfile('${c.id}')">

      <div style="min-width:0" onclick="openProfile('${c.id}')">
        <div class="nm">${c.name}, ${c.age} ${c.verified?`<span class="badge-verif" style="width:15px;height:15px;display:inline-grid;vertical-align:-2px">${I.verif}</span>`:''}</div>

      </div>
      <div class="acts">
        <button class="rowbtn ghost ${_playing===c.id?'playing':''}" aria-label="Voice-Intro abspielen"
          onclick="playIntro('${c.id}','${c.name}')">${_playing===c.id?I.mic:PLAY_ICON}</button>

      </div>
    </div>`).join("");
}

/* Matches tab — call or unmatch, mirroring the React screen. */
function matchesList(){
  const ms=CREATORS.filter(c=>(state.liked.has(c.id)||["mia","sofia"].includes(c.id))&&!_unmatched.has(c.id));
  if(!ms.length)return `<p class="muted center" style="font-size:13px;margin-top:30px">Noch keine Matches — like Leute in Explore oder Discover.</p>`;
  return `<div class="section-title">Deine Matches <span class="muted" style="font-weight:600;font-size:12px">${ms.length}</span></div>` + ms.map(c=>`
    <div class="lrow">
      <div class="avatar" style="${photoStyle(c.id)}" onclick="openProfile('${c.id}')">
        ${c.online?'<span class="presence"></span>':''}</div>

function startCall(id,type){
  closeOverlay();
  const c=byId(id);state.callRate=c.rate;state.callSecs=0;state.callCost=0;state.callId=id;
  const call=document.createElement("div");call.className="call";
  call.innerHTML=`
    <div class="bg" style="${photoStyle(id)}"></div>
    <div class="veil"></div>
    <div class="top">
      <div class="who">${c.name}</div>
      <div class="status" id="callStatus">${type==='live'?'Livestream läuft':'verbindet…'}</div>
      <div class="ticker"><div class="cost tnum" id="callCost">0,00 €</div><div class="rate">${EUR(c.rate)} / Minute · <span id="callTime">00:00</span></div></div>
    </div>
    <div class="self" style="${photoStyle('you')}"></div>
    <div class="controls">
      <div class="ctrow">
        <button class="cbtn" onclick="toast('Mikro stumm')">${I.mic}</button>
        <button class="cbtn" aria-label="Tip senden" onclick="openTip('${id}')">${I.bolt}</button>
        <button class="cbtn tip" aria-label="Geschenk senden" onclick="openGift('${id}')">${I.gift}</button>
        <button class="cbtn" aria-label="Teilnehmer hinzufügen" onclick="openAddPeople()">${I.plus}</button>
        <button class="cbtn" onclick="toast('Kamera gewechselt')">${I.camflip}</button>
      </div>
      <button class="cbtn end" style="width:72px;height:72px" onclick="endCall()">${I.phone}</button>
      <div style="font-size:12px;opacity:.8">${type==='live'?'Live-Anrufe werden pro Minute abgerechnet':'Abrechnung startet bei Verbindung'}</div>
    </div>`;
  document.getElementById("phone").appendChild(call);
  requestAnimationFrame(()=>call.classList.add("show"));
  setTimeout(()=>{const s=document.getElementById("callStatus");if(s)s.textContent="verbunden";
    state.callTimer=setInterval(tickCall,1000);},1400);
}
function tickCall(){
  state.callSecs++;
  const perSec=state.callRate/60;
  state.callCost+=perSec;
  if(state.balance-perSec<=0){updateBalance(-state.balance);endCall(true);return;}
  updateBalance(-perSec);
  const cc=document.getElementById("callCost");const ct=document.getElementById("callTime");
  if(cc)cc.textContent=EUR(state.callCost);
  const m=String(Math.floor(state.callSecs/60)).padStart(2,"0"),s=String(state.callSecs%60).padStart(2,"0");
  if(ct)ct.textContent=`${m}:${s}`;
}
function endCall(broke){
  clearInterval(state.callTimer);state.callTimer=null;
  const call=document.querySelector(".call");if(call){call.classList.remove("show");setTimeout(()=>call.remove(),340);}
  const mins=(state.callSecs/60);
  if(state.callSecs>0)toast(`Call beendet · ${Math.floor(mins)}:${String(state.callSecs%60).padStart(2,'0')} · ${EUR(state.callCost)}${broke?' · Guthaben leer':''}`);
  guests=[];
  const rated=state.callSecs>0?state.callId:null;
  if(broke)setTimeout(openWallet,400);
  else if(rated)setTimeout(()=>openRate(rated),500);
}

const REG_STEPS=6;

  if(reg.step>=REG_STEPS-1){stopRec();document.getElementById("reg").remove();
    const onb=document.querySelector(".onb");if(onb)onb.remove();return;}

    <div class="opt ${reg[key]===g?'on':''}" onclick="regPick('${key}','${g}')">

  if(s===0)body=`
    <h2>Registrieren und finde deine Liebe!</h2>
    <p class="muted" style="font-size:13.5px;margin-top:0">Erstelle dein kostenloses Konto.</p>
    <input class="field" placeholder="Vorname"><input class="field" placeholder="Nachname">
    <input class="field" type="email" placeholder="E-Mail-Adresse"><input class="field" type="tel" placeholder="Telefonnummer">
    <input class="field" type="password" placeholder="Passwort"><input class="field" type="password" placeholder="Passwort wiederholen">`;
  else if(s===1)body=`<h2>Was ist dein Geschlecht?</h2>${opts('gender',["Frau","Mann","Divers"])}`;
  else if(s===2)body=`<h2>Wonach suchst du?</h2>${opts('looking',["Frauen","Männer","Alle"])}`;
  else if(s===3)body=`
    <h2>Wie alt bist du?</h2>
    <div style="text-align:center;margin:30px 0">
      <div class="tnum" id="regAge" style="font-size:54px;font-weight:800">${reg.age}</div>
      <input type="range" min="18" max="80" value="${reg.age}" oninput="regAge(this.value)"
        style="width:100%;accent-color:var(--orange);margin-top:16px">
      <p class="muted" style="font-size:12.5px">Du musst mindestens 18 Jahre alt sein.</p>
    </div>`;
  else if(s===4)body=`
    <h2>Lade dein Profilbild hoch!</h2>
    <div style="width:210px;height:210px;border-radius:24px;margin:22px auto;${photoStyle('you')};box-shadow:var(--shadow)"></div>
    <button class="btn btn-ghost" style="margin-bottom:10px" onclick="toast('Galerie geöffnet (Demo)')">📁 Aus Galerie wählen</button>
    <button class="btn btn-ghost" onclick="toast('Kamera geöffnet (Demo)')">📷 Foto aufnehmen</button>`;
  else body=voiceStep();

  const label=s===0?"Jetzt registrieren":s===REG_STEPS-1?"Speichern & loslegen":"Weiter";
  document.getElementById("reg").innerHTML=`
    <div class="rtop">
      <button class="iconbtn" onclick="regBack()">${I.arrow}</button>
      <div class="prog"><i style="width:${((s+1)/REG_STEPS)*100}%"></i></div>
    </div>
    <div class="rbody">${body}</div>
    <div class="rfoot">
      <button class="btn btn-primary" onclick="regNext()" ${blocked?'disabled':''}
        style="opacity:${blocked?.5:1}">${label}</button>
    </div>`;
}

/* Voice intro recorder — Ring's signature step. Simulated, like the React one. */
function voiceStep(){
  const active=Math.min(46,Math.floor(reg.recT*5));
  const mm=String(Math.floor(reg.recT/60)).padStart(2,"0"),ss=String(Math.floor(reg.recT%60)).padStart(2,"0");
  return `
    <h2>Nimm deine Sprachnachricht auf</h2>
    <p class="muted" style="font-size:13.5px">Dein Voice-Intro hören andere in Explore, bevor sie dich anrufen.</p>
    <div class="wave" aria-hidden="true">${reg.bars.map((h,i)=>
      `<i class="${i<active?'':'off'}" style="height:${h}px"></i>`).join("")}</div>
    <div class="rec-time">${mm}:${ss}.${Math.floor((reg.recT%1)*10)}</div>
    <button class="rec-btn ${reg.recOn?'on':''}" onclick="toggleRegRec()"
      aria-label="${reg.recOn?'Pause':'Aufnehmen'}">${I.mic}</button>
    ${reg.recT>0&&!reg.recOn?`<button class="btn btn-outline btn-sm" style="width:auto;margin:0 auto;display:flex"
      onclick="reg.recT=0;drawRegister()">Löschen & neu aufnehmen</button>`:''}`;
}
function toggleRegRec(){
  reg.recOn=!reg.recOn;
  if(reg.recOn)reg.recTimer=setInterval(()=>{reg.recT=+(reg.recT+0.1).toFixed(1);drawRegister();},100);
  else stopRec();
  drawRegister();
}
function stopRec(){clearInterval(reg.recTimer);reg.recTimer=null;reg.recOn=false;}

/* ---- centred confirm/choice dialog (delete account, change picture) ---- */
function modal(html){

  m.onclick=e=>{if(e.target===m||e.target===m.firstElementChild)closeModal();};
  document.getElementById("phone").appendChild(m);
  requestAnimationFrame(()=>m.classList.add("show"));
}
function closeModal(){const m=document.getElementById("modal");if(m)m.remove();}
function askDelete(){

/* ---- Explore: voice-intro playback state for the "In deiner Nähe" rows ---- */

/* =========================================================================
   BOOKING — pick a package, a day, a time. Mirrors the React BookSheet.
   No escrow and no order states: the slot is reserved, and the paid call runs
   as usual when it starts. Those were declined for this round.
   ========================================================================= */
const book={cid:null,svc:null,day:null,time:null};
let bookNode=null;

function openBook(id){
  const svcs=SERVICES[id]||[];
  book.cid=id;book.svc=svcs[0]?svcs[0].id:null;book.day=null;book.time=null;
  bookNode=overlay(drawBook(),"full");
}
function bookPick(kind,val){
  if(kind==="svc")book.svc=val;
  else if(kind==="day"){book.day=+val;book.time=null;}
  else book.time=val;
  if(bookNode)bookNode.innerHTML=drawBook();
}
function drawBook(){
  const id=book.cid,c=byId(id),svcs=SERVICES[id]||[];
  const days=Array.from({length:7},(_,i)=>Object.assign({},dayLabel(i),{slots:availability(id,i)}));
  const chosen=svcs.find(s=>s.id===book.svc);
  const slots=book.day===null?[]:days[book.day].slots;
  const ready=chosen&&book.day!==null&&book.time;
  return `<div class="ftop">
      <button class="iconbtn" onclick="openProfile('${id}')">${I.arrow}</button>
      <h3>Termin bei ${c.name}</h3><span style="width:42px"></span>
    </div>
    <div class="fscreen" style="padding:4px 18px 30px">
      <div class="section-title">Leistung wählen</div>
      ${svcs.map(s=>`<div class="svc ${book.svc===s.id?'on':''}" onclick="bookPick('svc','${s.id}')">
        <div style="min-width:0"><div class="sv-n">${s.name}</div><div class="sv-d">${s.desc}</div></div>
        <div class="sv-p"><b>${EUR(s.price)}</b><span>${s.mins} Min</span></div></div>`).join("")}

      <div class="section-title">Tag wählen</div>
      <div class="daystrip">${days.map((d,i)=>`
        <div class="day ${book.day===i?'on':''} ${d.slots.length?'':'off'}"
          ${d.slots.length?`onclick="bookPick('day',${i})"`:''}>
          <div class="dw">${d.today?'Heute':d.dow}</div><div class="dn">${d.num}</div></div>`).join("")}</div>

      <div class="section-title">Uhrzeit</div>
      ${book.day===null?'<p class="muted" style="font-size:13px">Wähle zuerst einen Tag.</p>'
        :`<div class="slots">${slots.map(t=>`<span class="slot ${book.time===t?'on':''}" onclick="bookPick('time','${t}')">${t}</span>`).join("")}</div>`}

      <button class="btn btn-primary" style="margin-top:18px;opacity:${ready?1:.5}" ${ready?'':'disabled'}
        onclick="confirmBook()">Termin reservieren${ready?`<span class="btn-amt">· ${EUR(chosen.price)}</span>`:''}</button>
      <p class="muted" style="font-size:11.5px;text-align:center;margin-top:10px">
        Bezahlt wird erst beim Call — dein Guthaben wird jetzt nicht belastet.</p>
    </div>`;
}
function confirmBook(){
  const c=byId(book.cid),svcs=SERVICES[book.cid]||[];
  const chosen=svcs.find(s=>s.id===book.svc);
  const d=dayLabel(book.day);
  state.bookings.push({key:Date.now(),cid:book.cid,svc:chosen,dayOffset:book.day,time:book.time});
  closeOverlay();
  toast(`Termin bei ${c.name} reserviert · ${d.dow}. ${book.time} Uhr`);
  render();
}

/* =========================================================================
   REVIEWS — star runs, the profile list, and the prompt after a call ends.
   USER_REVIEWS starts as the seed data and grows as the user rates.
   ========================================================================= */
let USER_REVIEWS=Object.assign({},REVIEWS);
const rate={cid:null,stars:0};

/* Filled/empty star run. `n` of 5. */
function stars(n,big){
  return `<span class="stars ${big?'big':''}">`+
    [1,2,3,4,5].map(i=>`<span class="${i<=n?'':'off'}">${I.star}</span>`).join("")+`</span>`;
}
function reviewList(id){
  return (USER_REVIEWS[id]||[]).map(r=>`<div class="rv">
    <div class="rv-av">${r.by.slice(0,1)}</div>
    <div style="min-width:0">
      <div><span class="rv-n">${r.by}</span><span class="rv-w">${r.when}</span></div>
      ${stars(r.stars)}
      <p>${r.text}</p>
    </div></div>`).join("");
}
function openRate(id){
  rate.cid=id;rate.stars=0;
  modal(drawRate());
}
function drawRate(){
  const c=byId(rate.cid);
  return `<h3>Wie war dein Call mit ${c.name}?</h3>
    <p>Deine Bewertung hilft anderen bei der Auswahl.</p>
    <div class="rate-pick">${[1,2,3,4,5].map(i=>
      `<button class="${i<=rate.stars?'on':''}" aria-label="${i} Sterne" onclick="pickStars(${i})">${I.star}</button>`).join("")}</div>
    <input class="field" id="rateText" placeholder="Kurz sagen, wie es war (optional)">
    <div class="mrow" style="margin-top:12px">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Später</button>
      <button class="btn btn-primary btn-sm" ${rate.stars?'':'disabled'} style="opacity:${rate.stars?1:.5}"
        onclick="submitRate()">Absenden</button>
    </div>`;
}
function pickStars(n){
  rate.stars=n;
  const keep=document.getElementById("rateText");const txt=keep?keep.value:"";
  const box=document.querySelector("#modal .mbox");
  if(box){box.innerHTML=drawRate();const f=document.getElementById("rateText");if(f)f.value=txt;}
}
function submitRate(){
  const f=document.getElementById("rateText");
  const text=(f&&f.value.trim())||"Keine weitere Rückmeldung.";
  const id=rate.cid,c=byId(id);
  USER_REVIEWS[id]=[{id:"u"+Date.now(),by:"Du",stars:rate.stars,when:"gerade eben",text}].concat(USER_REVIEWS[id]||[]);
  closeModal();
  toast(`Danke für deine Bewertung von ${c.name}`);
  render();
}

/* =========================================================================
   GIFTS — fixed emoji items, charged straight to the wallet, plus the
   float-up animation. Separate from tips, which stay a free amount.
   ========================================================================= */
const gift={cid:null,sel:null};

function openGift(id){gift.cid=id;gift.sel=null;modal(drawGift());}
function drawGift(){
  const c=byId(gift.cid);
  const g=GIFTS.find(x=>x.id===gift.sel);
  return `<h3>Geschenk an ${c.name}</h3>
    <p>Wird sofort von deinem Guthaben abgebucht.</p>
    <div class="giftgrid">${GIFTS.map(x=>`
      <div class="giftcard ${gift.sel===x.id?'on':''}" onclick="pickGift('${x.id}')">
        <div class="g-em">${x.em}</div><div class="g-n">${x.name}</div><div class="g-p">${EUR(x.price)}</div>
      </div>`).join("")}</div>
    <div class="mrow" style="margin-top:12px">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary btn-sm" ${g?'':'disabled'} style="opacity:${g?1:.5}"
        onclick="sendGift()">Senden${g?`<span class="btn-amt">· ${EUR(g.price)}</span>`:''}</button>
    </div>`;
}
function pickGift(id){
  gift.sel=id;
  const box=document.querySelector("#modal .mbox");
  if(box)box.innerHTML=drawGift();
}
function sendGift(){
  const g=GIFTS.find(x=>x.id===gift.sel),c=byId(gift.cid);
  if(state.balance<g.price){closeModal();toast("Guthaben zu niedrig — bitte aufladen.");openWallet();return;}
  updateBalance(-g.price);
  closeModal();
  toast(`${g.em} ${g.name} an ${c.name} gesendet`);
  flyGift(g.em);
  render();
}
function flyGift(em){
  const el=document.createElement("div");el.className="giftfly";el.textContent=em;
  document.getElementById("phone").appendChild(el);
  setTimeout(()=>el.remove(),1700);
}

/* Top creators, scored by delivered calls weighted by rating. */
function leaderboardList(){
  return leaderboard(USER_REVIEWS).slice(0,5).map((c,i)=>`
    <div class="lbrow" onclick="openProfile('${c.id}')">
      <div class="rank ${i<3?'top':''}">${i+1}</div>
      <div class="avatar" style="width:38px;height:38px;${photoStyle(c.id)}"></div>
      <div style="min-width:0">
        <div class="lb-n">${c.name}</div>
        <div class="lb-s">Level ${STATS[c.id].level} · ${c.tags[0]}</div></div>
      <div class="lb-sc">${num(c.score)}<span>Punkte</span></div>
    </div>`).join("");
}

/* =========================================================================

      <button class="sharetile" onclick="shareTo('${t.name}')">

        <span class="lbl2">${t.name}</span>
      </button>`).join("")}</div>
    <div class="mrow" style="margin-top:14px">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary btn-sm" onclick="closeModal();toast('Link kopiert')">Link kopieren</button>

function shareTo(name){closeModal();toast(`Geteilt auf ${name}`);}

/* =========================================================================
   CALL GUESTS — add up to five more people to a running call.
   Mirrors the React AddPeopleSheet; guests live only for the current call.
   ========================================================================= */
const MAX_GUESTS=5;
let guests=[];

function openAddPeople(){modal(drawAddPeople());}
function drawAddPeople(){
  const pool=CREATORS.filter(c=>c.id!==state.callId);
  const full=guests.length>=MAX_GUESTS;
  return `<h3 style="text-align:center">Teilnehmer hinzufügen</h3>
    <p style="text-align:center">${guests.length} von ${MAX_GUESTS} ausgewählt${full?' — Maximum erreicht':''}</p>
    <div style="max-height:42vh;overflow-y:auto;text-align:left">${pool.map(c=>{
      const on=guests.includes(c.id);
      return `<div class="pickrow ${on?'on':''} ${!on&&full?'full':''}" onclick="toggleGuest('${c.id}')">
        <span class="avatar" style="width:38px;height:38px;${photoStyle(c.id)}"></span>
        <div style="min-width:0">
          <div class="pk-n">${c.name}, ${c.age}</div>
          <div class="pk-s">${c.online?'online':'offline'} · ${EUR(c.rate)}/Min</div></div>
        <span class="pk-c">${on?I.check:''}</span></div>`;}).join("")}</div>
    <div class="mrow" style="margin-top:14px">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Fertig</button>
      <button class="btn btn-primary btn-sm" ${guests.length?'':'disabled'} style="opacity:${guests.length?1:.5}"
        onclick="closeModal();toast('${guests.length} Teilnehmer im Call')">Übernehmen</button>
    </div>`;
}
function toggleGuest(id){
  if(guests.includes(id))guests=guests.filter(g=>g!==id);
  else if(guests.length<MAX_GUESTS)guests.push(id);
  const box=document.querySelector("#modal .mbox");
  if(box)box.innerHTML=drawAddPeople();
  renderGuests();
}
function dropGuest(id){guests=guests.filter(g=>g!==id);renderGuests();}
function renderGuests(){
  const call=document.querySelector(".call");if(!call)return;
  let wrap=call.querySelector(".parts");
  if(!guests.length){if(wrap)wrap.remove();return;}
  if(!wrap){wrap=document.createElement("div");wrap.className="parts";call.appendChild(wrap);}
  wrap.innerHTML=guests.map(g=>`<div class="part" style="${photoStyle(g)}">
      <span class="drop" onclick="dropGuest('${g}')">✕</span>
      <span class="pn">${byId(g).name}</span></div>`).join("");
}
