<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ring — Match. Ring. Connect.</title>
<style>
/* ============================================================
   RING — Dating trifft Creator-Economy
   Design tokens (light + dark), warm-biased neutrals
   ============================================================ */
:root{
  --orange:#F5761A;            /* brand / primary CTA */
  --orange-ink:#C9560A;
  --amber:#FDB43C;
  --red:#F5471F;
  --heart:#FF3D71;             /* the dating spark */
  --live:#25C26E;
  --gold:#E7A419;

  --ink:#17130F;               /* near-black, warm */
  --ink-2:#4A423B;
  --muted:#8B8680;             /* warm grey */
  --line:#EFE9E2;
  --paper:#FFFFFF;
  --cream:#FFF8F2;             /* warm section ground */
  --card:#FFFFFF;
  --card-2:#FBF6F0;
  --shadow:0 18px 44px -18px rgba(60,32,8,.34);
  --shadow-sm:0 8px 22px -12px rgba(60,32,8,.30);
  --brand-grad:linear-gradient(135deg,var(--amber),var(--orange) 46%,var(--red));
  --radius:22px;
  --safe-top:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#FBF5EE; --ink-2:#C9C0B6; --muted:#9A938B; --line:#2C2620;
    --paper:#141009; --cream:#1B150F; --card:#1E1811; --card-2:#241D15;
    --shadow:0 20px 50px -18px rgba(0,0,0,.7);
    --shadow-sm:0 10px 26px -14px rgba(0,0,0,.65);
  }
}
:root[data-theme="light"]{
  --ink:#17130F; --ink-2:#4A423B; --muted:#8B8680; --line:#EFE9E2;
  --paper:#FFFFFF; --cream:#FFF8F2; --card:#FFFFFF; --card-2:#FBF6F0;
  --shadow:0 18px 44px -18px rgba(60,32,8,.34); --shadow-sm:0 8px 22px -12px rgba(60,32,8,.30);
}
:root[data-theme="dark"]{
  --ink:#FBF5EE; --ink-2:#C9C0B6; --muted:#9A938B; --line:#2C2620;
  --paper:#141009; --cream:#1B150F; --card:#1E1811; --card-2:#241D15;
  --shadow:0 20px 50px -18px rgba(0,0,0,.7); --shadow-sm:0 10px 26px -14px rgba(0,0,0,.65);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(253,180,60,.16), transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, rgba(245,71,31,.13), transparent 55%),
    #EDE6DE;
  -webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding:26px 12px;min-height:100%;
}
@media (prefers-color-scheme: dark){ body{ background:radial-gradient(1200px 700px at 15% -10%, rgba(253,180,60,.10), transparent 60%),radial-gradient(1000px 700px at 110% 10%, rgba(245,71,31,.10), transparent 55%),#0C0906; } }
:root[data-theme="dark"] body{ background:radial-gradient(1200px 700px at 15% -10%, rgba(253,180,60,.10), transparent 60%),radial-gradient(1000px 700px at 110% 10%, rgba(245,71,31,.10), transparent 55%),#0C0906; }
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Phone shell ---------- */
.phone{
  width:min(430px,96vw); height:min(920px,92vh); position:relative;
  background:var(--paper); border-radius:44px; overflow:hidden;
  box-shadow:var(--shadow), 0 0 0 10px #0b0906, 0 0 0 12px rgba(255,255,255,.06);
  display:flex;flex-direction:column;
}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#0b0906;border-bottom-left-radius:16px;border-bottom-right-radius:16px;z-index:60}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 4px;font-size:13px;font-weight:600;color:var(--ink);z-index:40}
.statusbar .dots{display:flex;gap:5px;align-items:center}
.statusbar .bar{width:17px;height:11px;border:1.4px solid var(--ink);border-radius:3px;position:relative}
.statusbar .bar::after{content:"";position:absolute;inset:1.6px;right:5px;background:var(--ink);border-radius:1px}

/* ---------- App scaffold ---------- */
.app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.pad{padding:6px 18px 120px}

.appbar{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;gap:12px}
.appbar h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.appbar .sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;transition:transform .15s, background .2s}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:20px;height:20px}

/* wallet chip */
.wallet-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--brand-grad);color:#fff;font-weight:700;font-size:13.5px;border:none;cursor:pointer;box-shadow:var(--shadow-sm)}
.wallet-chip:active{transform:scale(.96)}
.wallet-chip .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff6,transparent 60%),#fff3;display:grid;place-items:center;font-size:10px}

/* ---------- Brand / ring logo ---------- */
.brandrow{display:flex;align-items:center;gap:10px}
.ring-logo{width:34px;height:34px;position:relative;flex:none}
.ring-logo::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 220deg,var(--amber),var(--orange) 40%,var(--red) 65%,transparent 66%);-webkit-mask:radial-gradient(circle,transparent 40%,#000 42%);mask:radial-gradient(circle,transparent 40%,#000 42%);animation:spin 7s linear infinite}
.ring-logo::after{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--brand-grad)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring-logo::before{animation:none}}
.wordmark{font-size:23px;font-weight:800;letter-spacing:-.03em}
.wordmark b{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;cursor:pointer;font-weight:700;font-size:16px;padding:15px 22px;border-radius:999px;transition:transform .14s, filter .2s;width:100%}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--brand-grad);color:#fff;box-shadow:0 12px 26px -12px rgba(245,118,26,.75)}
.btn-ghost{background:var(--card-2);color:var(--ink);border:1px solid var(--line)}
.btn-outline{background:transparent;color:var(--orange);border:1.6px solid var(--orange)}
.btn svg{width:19px;height:19px}
.btn-sm{padding:10px 16px;font-size:13.5px}

/* ---------- Segmented ---------- */
.seg{display:flex;gap:4px;background:var(--card-2);border:1px solid var(--line);padding:4px;border-radius:999px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;padding:9px 0;border-radius:999px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sm)}
:root[data-theme="dark"] .seg button.on{background:#312820}

/* ---------- Discover swipe cards ---------- */
.deck{position:relative;height:560px;margin:6px 4px 0;touch-action:pan-y}
.swipe{position:absolute;inset:0;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);will-change:transform;user-select:none;cursor:grab;background:#222}
.swipe .photo{position:absolute;inset:0}
.swipe .grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,6,2,.15) 58%,rgba(10,6,2,.85))}
.swipe .meta{position:absolute;left:0;right:0;bottom:0;padding:20px;color:#fff}
.swipe .name{font-size:26px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.swipe .name .age{font-weight:500;opacity:.92}
.swipe .row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fff}
.chip.live{background:var(--live)}
.chip.price{background:rgba(0,0,0,.42)}
.badge-verif{color:#fff;background:#3B9CFF;border-radius:50%;width:19px;height:19px;display:inline-grid;place-items:center;font-size:11px;flex:none}
.tag{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff}
.stamp{position:absolute;top:34px;font-size:34px;font-weight:900;letter-spacing:.04em;padding:6px 16px;border:4px solid;border-radius:14px;opacity:0;transform:rotate(-16deg);pointer-events:none}
.stamp.like{left:22px;color:var(--live);border-color:var(--live)}
.stamp.nope{right:22px;color:var(--heart);border-color:var(--heart);transform:rotate(16deg)}

.deck-actions{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:16px}
.round{border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow-sm);transition:transform .14s}
.round:active{transform:scale(.9)}
.round svg{width:24px;height:24px}
.round.lg{width:66px;height:66px}
.round.md{width:54px;height:54px}
.round.pass svg{color:var(--heart)}
.round.like{background:var(--brand-grad)}.round.like svg{color:#fff;width:30px;height:30px}
.round.dial{background:var(--live)}.round.dial svg{color:#fff}
.round.star svg{color:var(--gold)}

/* ---------- Generic cards / lists ---------- */
.section-title{font-size:15px;font-weight:800;margin:20px 2px 12px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between}
.section-title a{color:var(--orange);font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

.story{flex:none;width:70px;text-align:center;cursor:pointer}
.story .av{width:64px;height:64px;border-radius:50%;padding:3px;background:var(--brand-grad);margin:0 auto}
.story .av.seen{background:var(--line)}
.story .av > div{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--paper);background-size:cover;position:relative;overflow:hidden}
.story .lv{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);background:var(--live);color:#fff;font-size:8.5px;font-weight:800;padding:1.5px 6px;border-radius:999px;border:1.5px solid var(--paper)}
.story .nm{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.creator-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccard{border-radius:18px;overflow:hidden;position:relative;aspect-ratio:3/4;box-shadow:var(--shadow-sm);cursor:pointer;background:#222}
.ccard .grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,4,1,.82))}
.ccard .top{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between}
.ccard .bot{position:absolute;left:11px;right:11px;bottom:11px;color:#fff}
.ccard .bot .n{font-weight:800;font-size:15px;display:flex;align-items:center;gap:5px}
.ccard .bot .s{font-size:11.5px;opacity:.9;display:flex;align-items:center;gap:5px;margin-top:3px}

/* ---------- Feed ---------- */
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.post-head{display:flex;align-items:center;gap:11px;padding:13px 14px}
.avatar{width:44px;height:44px;border-radius:50%;background-size:cover;flex:none;position:relative}
.avatar.ring{padding:2px;background:var(--brand-grad)}
.avatar.ring > div{width:100%;height:100%;border-radius:50%;border:2px solid var(--card);background-size:cover}
.post-head .n{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:5px}
.post-head .t{font-size:12px;color:var(--muted)}
.post-media{position:relative;aspect-ratio:4/5;background:#222}
.post-media .locked{position:absolute;inset:0;display:grid;place-items:center;gap:12px;color:#fff;text-align:center;padding:24px;background:rgba(10,6,2,.30);backdrop-filter:blur(18px)}
.post-media .locked .lk{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.post-media .locked h4{margin:0;font-size:17px;font-weight:800}
.post-media .locked p{margin:0;font-size:13px;opacity:.85;max-width:230px}
.post-actions{display:flex;align-items:center;gap:18px;padding:12px 15px 6px;color:var(--ink)}
.post-actions .a{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;cursor:pointer}
.post-actions .a svg{width:23px;height:23px}
.post-actions .a.on svg{color:var(--heart);fill:var(--heart)}
.post-actions .spacer{margin-left:auto}
.post-cap{padding:2px 15px 15px;font-size:14px;line-height:1.45}
.post-cap b{font-weight:700}

/* ---------- Chats ---------- */
.chat-row{display:flex;align-items:center;gap:13px;padding:12px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
.chat-row .n{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.chat-row .last{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.chat-row .meta{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.chat-row .time{font-size:11.5px;color:var(--muted)}
.pill-unread{background:var(--brand-grad);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 6px}
.presence{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--live);border:2.5px solid var(--card)}

/* ---------- Sheet / modal ---------- */
.sheet-scrim{position:absolute;inset:0;background:rgba(8,4,1,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:70;backdrop-filter:blur(2px)}
.sheet-scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;background:var(--paper);border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);z-index:71;display:flex;flex-direction:column;overflow:hidden}
.sheet.show{transform:translateY(0)}
.sheet .grip{width:40px;height:5px;border-radius:999px;background:var(--line);margin:9px auto 2px;flex:none}
.sheet-body{overflow-y:auto;scrollbar-width:none;padding:6px 18px 26px}
.sheet-body::-webkit-scrollbar{display:none}

/* full screen sheet (profile / call) */
.full{position:absolute;inset:0;background:var(--paper);z-index:72;transform:translateX(100%);transition:transform .34s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;overflow:hidden}
.full.show{transform:translateX(0)}
.full .fscreen{flex:1;overflow-y:auto;scrollbar-width:none}
.full .fscreen::-webkit-scrollbar{display:none}
.back{position:absolute;top:calc(var(--safe-top) + 30px);left:16px;z-index:5}

/* profile header */
.phero{position:relative;height:420px;background:#222}
.phero .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,4,1,.2) 0,transparent 30% 55%,rgba(8,4,1,.9))}
.phero .info{position:absolute;left:18px;right:18px;bottom:18px;color:#fff}
.phero .nm{font-size:29px;font-weight:800;display:flex;align-items:center;gap:8px}
.stat-row{display:flex;gap:22px;padding:16px 18px;border-bottom:1px solid var(--line)}
.stat-row .s b{font-size:18px;font-weight:800;display:block}
.stat-row .s span{font-size:12px;color:var(--muted)}

.tier{border:1.6px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;position:relative;background:var(--card)}
.tier.best{border-color:var(--orange);box-shadow:0 10px 30px -16px rgba(245,118,26,.6)}
.tier .badge{position:absolute;top:-11px;right:14px;background:var(--brand-grad);color:#fff;font-size:11px;font-weight:800;padding:4px 11px;border-radius:999px}
.tier .tn{font-weight:800;font-size:16px}
.tier .tp{font-weight:800;font-size:22px;margin:6px 0 2px}
.tier .tp span{font-size:13px;color:var(--muted);font-weight:600}
.tier ul{list-style:none;padding:0;margin:10px 0 14px;display:flex;flex-direction:column;gap:7px}
.tier li{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.tier li svg{width:16px;height:16px;color:var(--live);flex:none}

.gallery{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.gitem{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;background:#222;cursor:pointer}
.gitem .lock{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,4,1,.32);backdrop-filter:blur(12px);color:#fff}
.gitem .pv{position:absolute;bottom:6px;left:6px;font-size:10px;font-weight:800;background:rgba(0,0,0,.5);color:#fff;padding:3px 7px;border-radius:999px}

/* ---------- Call screen ---------- */
.call{position:absolute;inset:0;z-index:80;transform:translateY(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);overflow:hidden;color:#fff}
.call.show{transform:translateY(0)}
.call .bg{position:absolute;inset:0}
.call .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,3,1,.55),rgba(6,3,1,.2) 30%,rgba(6,3,1,.85))}
.call .top{position:absolute;top:calc(var(--safe-top) + 30px);left:0;right:0;text-align:center}
.call .who{font-size:24px;font-weight:800}
.call .status{font-size:13.5px;opacity:.85;margin-top:3px}
.call .ticker{display:inline-flex;flex-direction:column;align-items:center;margin-top:16px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border-radius:18px;padding:12px 22px;border:1px solid rgba(255,255,255,.15)}
.call .ticker .cost{font-size:30px;font-weight:800;letter-spacing:-.01em}
.call .ticker .rate{font-size:11.5px;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
.call .self{position:absolute;top:calc(var(--safe-top) + 30px);right:16px;width:96px;height:132px;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.4);box-shadow:var(--shadow)}
.call .controls{position:absolute;left:0;right:0;bottom:40px;display:flex;flex-direction:column;gap:16px;align-items:center;padding:0 24px}
.call .ctrow{display:flex;gap:18px;justify-content:center}
.call .cbtn{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:none;color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .14s}
.call .cbtn:active{transform:scale(.9)}
.call .cbtn.end{background:var(--heart)}
.call .cbtn.tip{background:var(--brand-grad)}
.call .cbtn svg{width:24px;height:24px}

/* ---------- Bottom tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-end;padding:9px 8px calc(env(safe-area-inset-bottom,10px) + 12px);background:color-mix(in srgb,var(--paper) 88%, transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:50}
.tab{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:700;padding:4px 8px;flex:1;position:relative}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--orange)}
.tab .dot{position:absolute;top:1px;right:calc(50% - 16px);width:8px;height:8px;background:var(--heart);border-radius:50%;border:1.5px solid var(--paper)}
.tab.center{flex:0}
.tab.center .fab{width:52px;height:52px;border-radius:50%;background:var(--brand-grad);display:grid;place-items:center;color:#fff;box-shadow:0 12px 24px -10px rgba(245,118,26,.8);margin-bottom:2px;margin-top:-14px}
.tab.center .fab svg{width:26px;height:26px}

/* ---------- Onboarding ---------- */
.onb{position:absolute;inset:0;z-index:90;background:var(--paper);display:flex;flex-direction:column;transition:opacity .4s, transform .4s}
.onb.hide{opacity:0;transform:scale(.98);pointer-events:none}
.onb .cluster{position:relative;flex:1;min-height:0;overflow:hidden}
.onb .blob{position:absolute;border-radius:50%;background:var(--brand-grad);opacity:.12;filter:blur(6px)}
.onb .pp{position:absolute;border-radius:50%;background-size:cover;box-shadow:var(--shadow);border:4px solid var(--paper)}
.onb .heart-i{position:absolute;color:var(--heart);opacity:.85}
.onb .content{padding:12px 26px 34px;text-align:center;display:flex;flex-direction:column;gap:14px}
.onb h2{font-size:29px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.12}
.onb p{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0}
.onb .fine{font-size:11.5px;color:var(--muted)}
.onb .fine b{color:var(--orange)}
.link{color:var(--ink);font-weight:700;cursor:pointer}

/* toast */

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function grad(seed){
  const h=hashStr(seed), a=h%360, b=(a+40+h%60)%360, c=(a+180+h%40)%360;
  return `radial-gradient(120% 100% at 20% 12%, hsl(${a} 78% 66%), transparent 55%),`+
         `radial-gradient(120% 120% at 88% 20%, hsl(${b} 72% 58%), transparent 55%),`+
         `linear-gradient(155deg, hsl(${c} 55% 42%), hsl(${(c+30)%360} 60% 30%))`;
}

/* ---- helpers ---- */
function toast(msg){
  let t=document.querySelector(".toast");
  if(!t){t=document.createElement("div");t.className="toast";document.getElementById("phone").appendChild(t)}
  t.textContent=msg;requestAnimationFrame(()=>t.classList.add("show"));
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);
}
function updateBalance(delta){state.balance=Math.max(0,state.balance+delta);document.querySelectorAll("[data-bal]").forEach(e=>e.textContent=EUR(state.balance));}

/* ---------- DISCOVER (swipe deck) ---------- */
function renderDiscover(pad){
  pad.innerHTML=`
  <div class="appbar">
    <div><div class="brandrow"><span class="ring-logo"></span><span class="wordmark">ring<b>.</b></span></div>

    <button class="round lg like" onclick="swipe('right')" aria-label="Like">${I.heart}</button>
    <button class="round md star" onclick="superLike()" aria-label="Super Ring">${I.star}</button>
  </div>
  <p class="center muted" style="font-size:11.5px;margin-top:14px">Anrufe über die Ring-Funktion kosten je nach Creator ab 0,99 €/Min.</p>`;
  buildDeck();
}
function buildDeck(){
  const deck=document.getElementById("deck");if(!deck)return;
  deck.innerHTML="";
  const list=CREATORS.slice(state.deckIdx,state.deckIdx+3).reverse();
  if(list.length===0){deck.innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px"><div><div style="font-size:40px">🎉</div><p style="font-weight:700;color:var(--ink)">Das war's für heute!</p><p style="font-size:13px">Schau später wieder rein für neue Vorschläge.</p><button class="btn btn-outline btn-sm" style="width:auto" onclick="state.deckIdx=0;buildDeck()">Neu starten</button></div></div>`;return;}
  list.forEach((c,i)=>{
    const top=i===list.length-1;
    const el=document.createElement("div");
    el.className="swipe";el.dataset.cid=c.id;
    el.style.transform=`scale(${1-(list.length-1-i)*0.04}) translateY(${(list.length-1-i)*-10}px)`;
    el.innerHTML=`
      <div class="photo" style="${photoStyle(c.id)}"></div>
      <div class="grad"></div>
      <div class="stamp like">RING</div><div class="stamp nope">NOPE</div>
      <div class="meta">
        <div class="name">${c.name} <span class="age">${c.age}</span> ${c.verified?`<span class="badge-verif">${I.verif}</span>`:""}</div>
        <div class="row">
          ${c.live?`<span class="chip live">● LIVE</span>`:c.online?`<span class="chip"><span style="width:7px;height:7px;background:var(--live);border-radius:50%"></span>Online</span>`:`<span class="chip">${c.dist} km entfernt</span>`}
          <span class="chip price">${I.phone} ${EUR(c.rate)}/Min</span>
        </div>
        <div class="row">${c.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </div>`;
    if(top){el.onclick=(e)=>{if(!el._moved)openProfile(c.id)};attachDrag(el);}
    deck.appendChild(el);
  });
}
function attachDrag(el){
  let sx=0,sy=0,dx=0,dy=0,drag=false;
  const down=(x,y)=>{drag=true;sx=x;sy=y;el._moved=false;el.style.transition="none";el.style.cursor="grabbing";};
  const move=(x,y)=>{if(!drag)return;dx=x-sx;dy=y-sy;if(Math.abs(dx)>6)el._moved=true;
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx*0.05}deg)`;
    el.querySelector(".stamp.like").style.opacity=Math.max(0,dx/120);
    el.querySelector(".stamp.nope").style.opacity=Math.max(0,-dx/120);};
  const up=()=>{if(!drag)return;drag=false;el.style.cursor="grab";el.style.transition="transform .3s";
    if(dx>110){fly(dx,dy,"right");}else if(dx<-110){fly(dx,dy,"left");}
    else{el.style.transform="";el.querySelector(".stamp.like").style.opacity=0;el.querySelector(".stamp.nope").style.opacity=0;}
    dx=dy=0;};
  const fly=(x,y,dir)=>{el.style.transform=`translate(${dir==="right"?600:-600}px,${y}px) rotate(${dir==="right"?30:-30}deg)`;
    setTimeout(()=>doSwipe(dir),260);};
  el.addEventListener("pointerdown",e=>{el.setPointerCapture(e.pointerId);down(e.clientX,e.clientY)});
  el.addEventListener("pointermove",e=>move(e.clientX,e.clientY));
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}
function swipe(dir){const deck=document.getElementById("deck");const top=deck&&deck.lastElementChild;
  if(top&&top.classList.contains("swipe")){top.style.transition="transform .3s";top.style.transform=`translate(${dir==="right"?600:-600}px,0) rotate(${dir==="right"?30:-30}deg)`;setTimeout(()=>doSwipe(dir),240);}}
function doSwipe(dir){
  const c=CREATORS[state.deckIdx];
  if(dir==="right"&&c){state.liked.add(c.id);heartBurst();toast(`Du hast ${c.name} geliked 💛`);}
  state.deckIdx++;buildDeck();
}
function superLike(){const c=CREATORS[state.deckIdx];if(!c)return;toast(`Super Ring an ${c.name}! ⭐ Sie wird's zuerst sehen.`);state.deckIdx++;buildDeck();}
function afterSwipeCall(){const c=CREATORS[state.deckIdx];if(!c)return;startCall(c.id,"video");}
function heartBurst(){
  const wrap=document.createElement("div");wrap.className="hearts-fly";wrap.style.left="50%";wrap.style.top="55%";
  document.getElementById("phone").appendChild(wrap);
  for(let i=0;i<8;i++){const h=document.createElement("div");h.textContent="❤";h.style.cssText=`position:absolute;font-size:${14+Math.random()*16}px;color:var(--heart)`;
    wrap.appendChild(h);const ang=Math.random()*Math.PI*2,d=40+Math.random()*80;
    h.animate([{transform:"translate(0,0) scale(.4)",opacity:1},{transform:`translate(${Math.cos(ang)*d}px,${Math.sin(ang)*d-40}px) scale(1.2)`,opacity:0}],{duration:900,easing:"cubic-bezier(.2,.7,.3,1)"});}
  setTimeout(()=>wrap.remove(),950);
}

/* =========================================================================

function overlay(html,cls){
  closeOverlay();
  const scrim=document.createElement("div");scrim.className="sheet-scrim";scrim.onclick=closeOverlay;
  const node=document.createElement("div");node.className=cls;node.innerHTML=html;
  document.getElementById("phone").appendChild(scrim);document.getElementById("phone").appendChild(node);
  requestAnimationFrame(()=>{scrim.classList.add("show");node.classList.add("show");});
  return node;
}
function closeOverlay(){document.querySelectorAll(".sheet,.sheet-scrim,.full").forEach(n=>{n.classList.remove("show");setTimeout(()=>n.remove(),340);});}

/* =========================================================================
   CALL SCREEN (paid, per-minute ticker)
   ========================================================================= */
function startCall(id,type){
  closeOverlay();
  const c=byId(id);state.callRate=c.rate;state.callSecs=0;state.callCost=0;state.callId=id;
  const call=document.createElement("div");call.className="call";
  call.innerHTML=`
    <div class="bg" style="${photoStyle(id)}"></div>
    <div class="veil"></div>
    <div class="top">
      <div class="who">${c.name}</div>
      <div class="status" id="callStatus">${type==='live'?'Livestream läuft':'verbindet…'}</div>
      <div class="ticker"><div class="cost tnum" id="callCost">0,00 €</div><div class="rate">${EUR(c.rate)} / Minute · <span id="callTime">00:00</span></div></div>
    </div>
    <div class="self" style="${photoStyle('you')}"></div>
    <div class="controls">
      <div class="ctrow">
        <button class="cbtn" onclick="toast('Mikro stumm')">${I.mic}</button>
        <button class="cbtn tip" onclick="openTip('${id}')">${I.gift}</button>
        <button class="cbtn" onclick="toast('Kamera gewechselt')">${I.camflip}</button>
      </div>
      <button class="cbtn end" style="width:72px;height:72px" onclick="endCall()">${I.phone}</button>
      <div style="font-size:12px;opacity:.8">${type==='live'?'Live-Anrufe werden pro Minute abgerechnet':'Abrechnung startet bei Verbindung'}</div>
    </div>`;
  document.getElementById("phone").appendChild(call);
  requestAnimationFrame(()=>call.classList.add("show"));
  setTimeout(()=>{const s=document.getElementById("callStatus");if(s)s.textContent="verbunden";
    state.callTimer=setInterval(tickCall,1000);},1400);
}
function tickCall(){
  state.callSecs++;
  const perSec=state.callRate/60;
  state.callCost+=perSec;
  if(state.balance-perSec<=0){updateBalance(-state.balance);endCall(true);return;}
  updateBalance(-perSec);
  const cc=document.getElementById("callCost");const ct=document.getElementById("callTime");
  if(cc)cc.textContent=EUR(state.callCost);
  const m=String(Math.floor(state.callSecs/60)).padStart(2,"0"),s=String(state.callSecs%60).padStart(2,"0");
  if(ct)ct.textContent=`${m}:${s}`;
}
function endCall(broke){
  clearInterval(state.callTimer);state.callTimer=null;
  const call=document.querySelector(".call");if(call){call.classList.remove("show");setTimeout(()=>call.remove(),340);}
  const mins=(state.callSecs/60);
  if(state.callSecs>0)toast(`Call beendet · ${Math.floor(mins)}:${String(state.callSecs%60).padStart(2,'0')} · ${EUR(state.callCost)}${broke?' · Guthaben leer':''}`);
  if(broke)setTimeout(openWallet,400);
}

/* ---- theme + clock ---- */
function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"));
  document.documentElement.setAttribute("data-theme",next);toast(next==="dark"?"Dark Mode":"Light Mode");}
function clock(){const d=new Date();document.getElementById("clock").textContent=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");}
clock();setInterval(clock,10000);

      <div class="brandrow" style="justify-content:center;margin-bottom:2px"><span class="ring-logo" style="width:40px;height:40px"></span><span class="wordmark" style="font-size:30px">ring<b>.</b></span></div>
      <h2>Match. Ring.<br>Connect.</h2>
      <p>Finde Menschen und Creator, die zu dir passen — like dich durch, ruf direkt an und unterstütze deine Favoriten mit Abos, Tips & exklusiven Inhalten.</p>
      <button class="btn btn-primary" onclick="finishOnboarding()">Los geht's</button>
      <div class="fine">Schon dabei? <span class="link" onclick="finishOnboarding()">Anmelden</span></div>
      <div class="fine">Mit „Los geht's" akzeptierst du unsere <b>AGB</b> & <b>Datenschutz</b>.</div>
    </div>`;
  document.getElementById("phone").appendChild(onb);
  const cl=onb.querySelector("#cluster");
  const pos=[[50,42,120],[168,70,84],[250,150,96],[70,150,80],[150,235,110],[262,258,72]];
  pos.forEach((p,i)=>{const d=document.createElement("div");d.className="pp";
    d.style.cssText=`left:${p[0]}px;top:${p[1]}px;width:${p[2]}px;height:${p[2]}px;${photoStyle(av[i])}`;
    d.style.animation=`float ${3+i*0.4}s ease-in-out ${i*0.2}s infinite alternate`;cl.appendChild(d);});
  for(let i=0;i<5;i++){const h=document.createElement("div");h.className="heart-i";h.innerHTML=I.heart;
    h.style.cssText=`left:${20+Math.random()*300}px;top:${20+Math.random()*300}px;width:${12+Math.random()*14}px;height:auto`;
    h.firstChild.style.width=(12+Math.random()*14)+"px";cl.appendChild(h);}
}
const style=document.createElement("style");
style.textContent=`@keyframes float{to{transform:translateY(-14px)}}@media (prefers-reduced-motion:reduce){.pp{animation:none!important}}`;
document.head.appendChild(style);
function finishOnboarding(){const onb=document.querySelector(".onb");onb.classList.add("hide");setTimeout(()=>onb.remove(),420);}

/* ---- boot ---- */
render();
onboarding();
window.go=go;window.swipe=swipe;window.superLike=superLike;window.afterSwipeCall=afterSwipeCall;

window.startCall=startCall;window.endCall=endCall;window.closeOverlay=closeOverlay;window.toggleTheme=toggleTheme;
window.startLiveView=startLiveView;window.finishOnboarding=finishOnboarding;window.buildDeck=buildDeck;window.state=state;
